<style>
  :root{
    --bg:#000; --card:#111214; --card-h:#1a1c20; --line:#2a2d33;
    --text:#f2f3f5; --sub:#9aa0a8; --dim:#6b7078;
    --sales:#3b82f6; --purchase:#10b981; --cost:#a78bfa; --team:#f472b6; --new:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 16px 32px}
  header{text-align:center;margin-bottom:40px}
  .co{font-size:14px;letter-spacing:.2em;color:var(--sub);margin:0 0 10px}
  h1{font-size:30px;margin:0;font-weight:700}
  .today{margin-top:10px;font-size:14px;color:var(--dim)}
  main{width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:stretch;gap:16px}
  a.btn{flex:1 1 auto;display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);
        background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:22px 24px;transition:background .15s,transform .15s}
  a.btn:hover,a.btn:focus-visible{background:var(--card-h);transform:translateY(-2px);outline:none}
  .ico{font-size:30px;line-height:1}
  .name{font-size:21px;font-weight:700}
  .url{font-size:12px;color:var(--dim);margin-top:4px}
  .arrow{margin-left:auto;font-size:22px;color:var(--c)}
  .upd{flex:0 0 236px;background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
  .upd .lb{font-size:12px;color:var(--sub)}
  .upd .dt{white-space:nowrap;font-size:17px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .upd .meta{font-size:12px;color:var(--sub);margin-top:4px}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#000;background:var(--new);
         border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
  .err{color:#f87171}
  footer{margin-top:auto;padding-top:40px;font-size:12px;color:var(--dim);text-align:center}
  footer button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;
                padding:5px 12px;cursor:pointer;font:inherit;margin-left:8px}
  footer button:hover{color:var(--text)}
  @media (max-width:600px){
    body{padding-top:36px}
    h1{font-size:24px}
    .row{flex-direction:column;gap:0}
    a.btn{border-radius:14px 14px 0 0;padding:18px}
    .upd{flex:none;border-top:none;border-radius:0 0 14px 14px;flex-direction:row;flex-wrap:wrap;
         align-items:baseline;justify-content:flex-start;gap:4px 10px;padding:10px 18px}
    .upd .dt,.upd .meta{margin-top:0}
  }

  /* 삼선 메뉴 */
  .hb{position:fixed;top:14px;left:14px;z-index:30;width:42px;height:42px;border-radius:10px;
      background:#0d0e10;border:1px solid var(--line);color:var(--text);cursor:pointer;
      display:flex;align-items:center;justify-content:center}
  .hb:hover{background:var(--card-h)}
  .hb svg{width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  .scrim.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:82vw;z-index:50;background:#0d0e10;
          border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s;
          padding:18px 12px;display:flex;flex-direction:column;gap:4px}
  .drawer.on{transform:none}
  .drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px;
              border-bottom:1px solid var(--line);margin-bottom:8px;font-weight:700}
  .drawer .x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
  .mi{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:9px;border:none;
      background:none;color:var(--text);font:inherit;font-size:15px;font-weight:400;cursor:pointer;text-align:left;text-decoration:none}
  .mi:hover{background:var(--card-h)}
  .msec{font-size:11px;color:var(--dim);padding:4px 12px 4px;letter-spacing:.05em}
  /* Member 창 — 오른쪽에서 밀려 나옴 */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.on{opacity:1;pointer-events:auto}
  .mbox{position:absolute;top:0;right:0;bottom:0;width:520px;max-width:100vw;display:flex;flex-direction:column;
        background:#0d0e10;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease}
  .modal.on .mbox{transform:none}
  /* 우측 상단 로그인 상태 */
  .who{position:fixed;top:14px;right:14px;z-index:30;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 6px;
       border-radius:21px;background:#0d0e10;border:1px solid var(--line);color:var(--text);cursor:pointer;font:inherit;font-size:14px}
  .who:hover{background:var(--card-h)}
  .who .av{width:30px;height:30px;border-radius:50%;background:#1f2937;display:flex;align-items:center;justify-content:center;
           font-size:13px;font-weight:700;color:#e5e7eb}
  .who.in .av{background:#2563eb;color:#fff}
  .who .dot{width:8px;height:8px;border-radius:50%;background:#6b7078}
  .who.in .dot{background:#22c55e}
  .who .rl{font-size:11px;color:var(--sub)}
  .acct{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .acct .av{width:40px;height:40px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .acct .nm{font-weight:700}
  .acct .sm{font-size:12px;color:var(--sub);margin-top:2px}
  .acct button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
  .acct button:hover{color:var(--text)}
  .mbody td.ll{color:var(--sub);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .mbody td.ll small{display:block;color:var(--dim);font-size:11px}
  @media (max-width:600px){ .who .nmt,.who .rl{display:none} .who{padding:0 6px} }
  .mhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .mhead h2{margin:0;font-size:18px}
  .mhead .cnt{font-size:13px;color:var(--sub)}
  .mhead .x{margin-left:auto;background:none;border:none;color:var(--sub);font-size:22px;cursor:pointer}
  .mbody{padding:14px 18px;overflow:auto;flex:1}
  .mbody table{width:100%;border-collapse:collapse;font-size:14px}
  .mbody th{text-align:left;font-size:12px;color:var(--sub);font-weight:600;padding:8px;border-bottom:1px solid var(--line);
            position:sticky;top:-14px;background:var(--card)}
  .mbody td{padding:9px 8px;border-bottom:1px solid #1f2227}
  .mbody td.no{color:var(--dim);width:36px;font-variant-numeric:tabular-nums}
  .mbody td.id{font-weight:700;font-family:ui-monospace,Consolas,monospace}
  .tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;border:1px solid var(--line);color:var(--sub)}
  .tag.adm{color:#fbbf24;border-color:#78591a}
  .tag.off{color:#f87171;border-color:#7f2d2d}
  .tag.pend{color:#60a5fa;border-color:#1e3a8a}
  .note{font-size:13px;color:var(--sub);line-height:1.6}
  .lf{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .lf input{background:#000;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font:inherit}
  .lf button{background:#2563eb;border:none;color:#fff;border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
  .lf button:disabled{opacity:.6}
  .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 18px;border-top:1px solid var(--line)}

<header>
  <p class="co">(주)동방파스텍</p>
  <h1>업무분석도구</h1>
  <div class="today" id="today"></div>
</header>

<main id="list"></main>

<footer>
  업데이트 일자는 GitHub 배포 시각 기준 · <span id="checked"></span>
  <button type="button" id="reload">새로 확인</button>
</footer>

<script>
(function(){
  'use strict';
  var OWNER = 'useran-coder';
  var TOOLS = [
    { key:'sales',    name:'매출 분석 도구', icon:'📈', color:'var(--sales)',
      url:'https://useran-coder.github.io/sales/',    repo:'sales' },
    { key:'purchase', name:'매입 분석 도구', icon:'📦', color:'var(--purchase)',
      url:'https://useran-coder.github.io/purchase/', repo:'purchase' },
    { key:'cost',     name:'가공비 견적기',  icon:'🧮', color:'var(--cost)',
      url:'https://useran-coder.github.io/cost/',     repo:'cost' },
    { key:'salesteam', name:'영업팀 업무분석', icon:'👥', color:'var(--team)',
      url:'https://useran-coder.github.io/salesteam/', repo:'salesteam' }
  ];
  var CACHE_KEY = 'dbfHomeUpd_v3';
  var CACHE_MS = 10 * 60 * 1000;   // 10분 안에는 다시 묻지 않음 (GitHub 무료 조회 한도 보호)
  var WD = ['일','월','화','수','목','금','토'];

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'') + n; }
  function kst(d){ // 한국 시간 기준 날짜 조각
    var k = new Date(d.getTime() + 9*3600*1000);
    return { y:k.getUTCFullYear(), m:k.getUTCMonth()+1, d:k.getUTCDate(), w:k.getUTCDay(),
             h:k.getUTCHours(), mi:k.getUTCMinutes() };
  }
  function fmtDate(d){ var p=kst(d); return p.y+'-'+pad(p.m)+'-'+pad(p.d)+' ('+WD[p.w]+')'; }
  function fmtTime(d){ var p=kst(d); return pad(p.h)+':'+pad(p.mi); }
  function dayDiff(d){
    var a=kst(d), b=kst(new Date());
    return Math.round((Date.UTC(b.y,b.m-1,b.d) - Date.UTC(a.y,a.m-1,a.d)) / 86400000);
  }
  function ago(n){ return n<=0 ? '오늘' : n===1 ? '어제' : n+'일 전'; }
  function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
  function writeCache(v){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(v)); }catch(e){} }

  var p = kst(new Date());
  $('today').textContent = '오늘 ' + p.y + '년 ' + p.m + '월 ' + p.d + '일 (' + WD[p.w] + ')';

  // 화면 그리기
  var list = $('list');
  TOOLS.forEach(function(t){
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<a class="btn" style="--c:'+t.color+'" href="'+t.url+'" target="_blank" rel="noopener">' +
        '<span class="ico">'+t.icon+'</span>' +
        '<span><div class="name">'+t.name+'</div><div class="url">'+t.url.replace('https://','')+'</div></span>' +
        '<span class="arrow">→</span></a>' +
      '<div class="upd" id="upd-'+t.key+'"><span class="lb">마지막 업데이트</span>' +
        '<span class="dt">확인 중…</span><span class="meta"></span></div>';
    list.appendChild(row);
  });

  function show(t, info){
    var box = $('upd-'+t.key);
    var dt = box.querySelector('.dt'), meta = box.querySelector('.meta');
    if(!info || !info.date){
      dt.innerHTML = '<span class="err">확인 못 함</span>';
      meta.textContent = '잠시 후 «새로 확인»';
      return;
    }
    var d = new Date(info.date), n = dayDiff(d);
    dt.innerHTML = fmtDate(d) + (n<=0 ? '<span class="badge">NEW</span>' : '');
    meta.textContent = fmtTime(d) + ' · ' + ago(n) + (info.ver ? ' · ' + info.ver : '');
  }

  // 파일 앞부분(약 40KB)만 읽고 끊기 → 버전 번호 찾기
  function headText(resp){
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    if(!resp.body || !resp.body.getReader) return resp.text().then(function(s){ return s.slice(0,40000); });
    var rd = resp.body.getReader(), dec = new TextDecoder('utf-8'), out = '';
    function pump(){
      return rd.read().then(function(r){
        if(r.value) out += dec.decode(r.value, {stream:true});
        if(r.done || out.length >= 40000){ try{ rd.cancel(); }catch(e){} return out; }
        return pump();
      });
    }
    return pump();
  }
  function findVer(s){
    var m = /APP_BUILD\s*=\s*['"](v\d+)['"]/.exec(s) || /<title>[^<]*?(v\d+)\s*<\/title>/.exec(s);
    return m ? m[1] : '';
  }

  // ① 기본: 같은 github.io 주소의 배포 파일 머리(Last-Modified = 배포 시각) — 조회 한도 없음
  function viaPages(t){
    return fetch(t.url, {headers:{Range:'bytes=0-40000'}, cache:'no-cache'}).then(function(r){
      var lm = r.headers.get('Last-Modified');
      return headText(r).then(function(s){
        if(!lm) throw new Error('no Last-Modified');
        return { date:new Date(lm).toISOString(), ver:findVer(s) };
      });
    });
  }
  // ② 예비: GitHub API(1시간 60회 한도) + raw 파일 머리
  function viaApi(t){
    var api = 'https://api.github.com/repos/'+OWNER+'/'+t.repo+'/commits?path=index.html&per_page=1';
    var raw = 'https://raw.githubusercontent.com/'+OWNER+'/'+t.repo+'/main/index.html';
    var commit = fetch(api, {headers:{Accept:'application/vnd.github+json'}})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(a){
        var c = a && a[0] && a[0].commit; if(!c) throw new Error('no commit');
        var m = /(?:st-)?v\d{2,5}/.exec(c.message||'');
        return { date:(c.committer||c.author).date, verMsg: m ? m[0] : '' };
      });
    var ver = fetch(raw, {headers:{Range:'bytes=0-40000'}, cache:'no-store'})
      .then(headText).then(findVer).catch(function(){ return ''; });
    return Promise.all([commit, ver]).then(function(r){
      return { date:r[0].date, ver: r[1] || r[0].verMsg };
    });
  }
  var ON_PAGES = /\.github\.io$/i.test(location.hostname);
  function fetchTool(t){
    if(!ON_PAGES) return viaApi(t);
    return viaPages(t).then(function(info){
      if(info.ver) return info;
      // 파일 안에 버전이 없는 도구(영업팀 업무분석)는 커밋 메시지에서만 버전 보충
      return viaApi(t).then(function(a){ return { date:info.date, ver:a.ver }; }, function(){ return info; });
    }, function(){ return viaApi(t); });
  }

  function load(force){
    var cache = readCache() || {};
    var fresh = !force && cache.at && (Date.now() - cache.at < CACHE_MS);
    if(fresh){
      TOOLS.forEach(function(t){ show(t, cache.data && cache.data[t.key]); });
      $('checked').textContent = fmtTime(new Date(cache.at)) + ' 확인';
      return;
    }
    TOOLS.forEach(function(t){ $('upd-'+t.key).querySelector('.dt').textContent = '확인 중…'; });
    var data = {}, okAll = true;
    Promise.all(TOOLS.map(function(t){
      return fetchTool(t).then(function(info){ data[t.key] = info; show(t, info); })
        .catch(function(){
          okAll = false;
          var old = cache.data && cache.data[t.key];   // 실패하면 지난 확인값이라도 표시
          data[t.key] = old || null;
          show(t, old);
          if(old) $('upd-'+t.key).querySelector('.meta').textContent += ' (지난 확인값)';
        });
    })).then(function(){
      if(okAll){ writeCache({at:Date.now(), data:data}); }
      $('checked').textContent = fmtTime(new Date()) + ' 확인' + (okAll ? '' : ' (일부 실패)');
    });
  }

  $('reload').addEventListener('click', function(){ load(true); });
  load(false);
})();
</script>
<script>
/* ── 삼선 메뉴 + Member(등록된 사람 목록) ──
   계정은 매출분석도구 로그인 서버와 같습니다. 같은 github.io 주소라서
   매출분석도구에 로그인해 둔 PC는 그 로그인을 그대로 씁니다(읽기만, 바꾸지 않음). */
(function(){
  'use strict';
  var AU_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbxSlND4ZKOpxISNQMRdV2d-LA5YxXS1BDe0k2TXKq6g7Tfm6PZ1Rse3mp0Nm4ndZXZdiQ/exec';
  var AU_KEY = 'dbang2026!';
  var SS_KEY = 'dbfHomeAu_v1';
  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function auUrl(){
    try{ var v=String(localStorage.getItem('au_url_override_v745')||'').trim();
      if(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v) && v.indexOf('AKfycbyEjIY0')<0) return v; }catch(e){}
    return AU_URL_DEFAULT;
  }

  // 메뉴 열고 닫기
  function openDrawer(){ $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
  function closeDrawer(){ $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); }
  $('hb').addEventListener('click', openDrawer);
  $('drawerX').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ if($('memModal').classList.contains('on')) closeMem(); else closeDrawer(); }
  });
  // 바로가기 링크(본문 버튼과 같은 목록)
  document.querySelectorAll('a.btn').forEach(function(a){
    var l=document.createElement('a'); l.className='mi'; l.href=a.href; l.target='_blank'; l.rel='noopener';
    l.textContent=(a.querySelector('.ico')||{}).textContent+' '+(a.querySelector('.name')||{}).textContent;
    $('drawerLinks').appendChild(l);
  });

  // 매출분석도구가 이 PC에 저장해 둔 로그인 읽기 (DB가 없으면 만들지 않음)
  function readSalesLogin(){
    return new Promise(function(res){
      try{
        var created=false, rq=indexedDB.open('dbpastec_sales');
        rq.onupgradeneeded=function(){ created=true; try{ rq.transaction.abort(); }catch(e){} };
        rq.onerror=function(){ res(null); };
        rq.onsuccess=function(){
          var db=rq.result;
          if(created || !db.objectStoreNames.contains('kv')){ db.close(); return res(null); }
          try{
            var g=db.transaction('kv','readonly').objectStore('kv').get('auth_v1');
            g.onsuccess=function(){ db.close(); res(g.result||null); };
            g.onerror=function(){ db.close(); res(null); };
          }catch(e){ db.close(); res(null); }
        };
      }catch(e){ res(null); }
    });
  }
  function valid(a){ return !!(a && a.token && a.exp && Date.now() < a.exp); }
  function getOwn(){ try{ return JSON.parse(sessionStorage.getItem(SS_KEY)||'null'); }catch(e){ return null; } }
  function setOwn(v){ try{ v?sessionStorage.setItem(SS_KEY,JSON.stringify(v)):sessionStorage.removeItem(SS_KEY); }catch(e){} }

  function call(payload){
    payload.key = AU_KEY;
    var ctl = window.AbortController ? new AbortController() : null;
    var t = ctl ? setTimeout(function(){ ctl.abort(); }, 25000) : null;
    return fetch(auUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload), signal: ctl?ctl.signal:undefined})
      .then(function(r){ return r.text(); })
      .then(function(tx){
        if(t) clearTimeout(t);
        var d; try{ d=JSON.parse(tx); }catch(e){ throw new Error('서버 응답을 읽지 못했습니다.'); }
        if(d && d.error) throw new Error(String(d.error));
        return d;
      }, function(e){
        if(t) clearTimeout(t);
        throw new Error(e && e.name==='AbortError' ? '서버가 25초 안에 응답하지 않았습니다.' : '서버에 연결하지 못했습니다.');
      });
  }

  var ROLE = {admin:'관리자', uploader:'업로더', user:'일반'};
  var cur = null;   // 지금 쓰는 로그인 {token,id,name,role,exp,src}

  function body(h){ $('memBody').innerHTML = h; }
  function showLogin(msg){
    $('memCnt').textContent=''; $('memFoot').style.display='none';
    body('<div class="note">'+(msg?esc(msg)+'<br>':'')+
      '매출분석도구와 같은 아이디로 로그인하세요. 관리자 계정만 목록을 볼 수 있습니다.</div>'+
      '<form class="lf" id="memLogin" autocomplete="on">'+
      '<input id="mlId" name="username" placeholder="아이디" autocomplete="username" required>'+
      '<input id="mlPw" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>'+
      '<button id="mlBtn" type="submit">로그인</button><div class="note" id="mlMsg" style="color:#f87171"></div></form>');
    $('memLogin').addEventListener('submit', function(e){
      e.preventDefault();
      var id=$('mlId').value.trim(), pw=$('mlPw').value;
      if(!id||!pw) return;
      $('mlBtn').disabled=true; $('mlBtn').textContent='확인 중…'; $('mlMsg').textContent='';
      call({action:'auLogin', id:id, pw:pw}).then(function(d){
        if(!d || !d.token || !d.user) throw new Error('로그인하지 못했습니다.');
        cur = {token:d.token, id:d.user.id, name:d.user.name, role:d.user.role, exp:d.exp, src:'own'};
        setOwn(cur); renderWho(); loadList();
      }).catch(function(err){
        $('mlMsg').textContent = err.message; $('mlBtn').disabled=false; $('mlBtn').textContent='로그인';
      });
    });
    setTimeout(function(){ var i=$('mlId'); if(i) i.focus(); }, 50);
  }

  function loadList(){
    if(cur && cur.role && cur.role!=='admin'){
      return showLogin((cur.name||cur.id)+'님은 '+(ROLE[cur.role]||cur.role)+' 권한이라 목록을 볼 수 없습니다.');
    }
    $('memFoot').style.display='';
    body('<div class="note">불러오는 중…</div>'); $('memCnt').textContent='';
    call({action:'auList', token:cur.token, fresh:Date.now()}).then(function(d){
      var all = (d && d.users) || [];
      all.sort(function(a,b){ return (b.pending?1:0)-(a.pending?1:0) || String(a.name||a.id).localeCompare(String(b.name||b.id),'ko'); });
      $('memCnt').textContent = all.length+'명';
      if(!all.length) return body(acctCard()+'<div class="note">등록된 사람이 없습니다.</div>');
      body(acctCard()+'<table><thead><tr><th>#</th><th>아이디</th><th>이름</th><th>마지막 로그인</th></tr></thead><tbody>'+
        all.map(function(u,i){
          var tags='';
          if(u.pending) tags+='<span class="tag pend">승인 대기</span>';
          else if(u.active===false) tags+='<span class="tag off">사용중지</span>';
          if(u.role==='admin') tags+='<span class="tag adm">관리자</span>';
          else if(u.role==='uploader') tags+='<span class="tag">업로더</span>';
          return '<tr><td class="no">'+(i+1)+'</td><td class="id">'+esc(u.id)+'</td><td>'+esc(u.name||'')+tags+'</td><td class="ll">'+lastLogin(u.lastLogin)+'</td></tr>';
        }).join('')+'</tbody></table>'+
        '<div class="note" style="margin-top:10px">계정 추가·삭제·권한 변경은 매출분석도구 관리자 메뉴에서 합니다.</div>');
      bindAcct();
    }).catch(function(err){
      if(/토큰|로그인|만료|권한|token|auth/i.test(err.message)){
        if(cur && cur.src==='own') setOwn(null);
        cur=null; renderWho(); return showLogin(err.message);
      }
      body('<div class="note" style="color:#f87171">'+esc(err.message)+'</div>');
    });
  }

  // 지금 로그인 상태 찾기: 이 화면 로그인 → 매출분석도구 로그인 순서
  function resolveLogin(){
    var own=getOwn();
    if(valid(own)) return Promise.resolve(own);
    return readSalesLogin().then(function(a){
      return valid(a) ? {token:a.token,id:a.id,name:a.name,role:a.role,exp:a.exp,src:'sales'} : null;
    });
  }
  function initial(n){ n=String(n||'').trim(); return n ? n.charAt(0).toUpperCase() : '?'; }
  function renderWho(){
    var w=$('who');
    if(cur){
      w.classList.add('in');
      $('whoAv').textContent=initial(cur.name||cur.id);
      $('whoName').textContent=cur.name||cur.id;
      $('whoRole').textContent=ROLE[cur.role]||'';
      w.title=(cur.name||cur.id)+' ('+cur.id+') 로그인 중'+(cur.src==='sales'?' · 매출분석도구 로그인 사용':'');
    }else{
      w.classList.remove('in');
      $('whoAv').textContent='?'; $('whoName').textContent='로그인'; $('whoRole').textContent=''; w.title='로그인하지 않음';
    }
  }
  function refreshWho(){ return resolveLogin().then(function(c){ cur=c; renderWho(); return c; }); }
  function acctCard(){
    if(!cur) return '';
    var left = Math.max(0, Math.round((cur.exp-Date.now())/60000));
    var leftTxt = left>=60 ? Math.floor(left/60)+'시간 '+(left%60)+'분' : left+'분';
    return '<div class="acct"><span class="av">'+esc(initial(cur.name||cur.id))+'</span><div>'+
      '<div class="nm">'+esc(cur.name||'')+' <span class="tag adm">'+esc(ROLE[cur.role]||cur.role||'')+'</span></div>'+
      '<div class="sm">'+esc(cur.id)+' · 로그인 남은 시간 '+leftTxt+(cur.src==='sales'?' · 매출분석도구 로그인 사용':'')+'</div></div>'+
      '<button type="button" id="acctOut">로그아웃</button></div>';
  }
  // 로그아웃: 서버에 알리고(실패해도 진행) 이 화면·매출분석도구 로그인 모두 지움(서버 주소는 남김)
  function clearSalesLogin(){
    return new Promise(function(res){
      try{
        var created=false, rq=indexedDB.open('dbpastec_sales');
        rq.onupgradeneeded=function(){ created=true; try{ rq.transaction.abort(); }catch(e){} };
        rq.onerror=function(){ res(); };
        rq.onsuccess=function(){
          var db=rq.result;
          if(created || !db.objectStoreNames.contains('kv')){ db.close(); return res(); }
          try{
            var st=db.transaction('kv','readwrite').objectStore('kv'), g=st.get('auth_v1');
            g.onsuccess=function(){
              var v=g.result||{};
              var put=st.put({token:'',id:'',name:'',role:'',exp:0,urlOverride:v.urlOverride||''},'auth_v1');
              put.onsuccess=function(){ db.close(); res(); };
              put.onerror=function(){ db.close(); res(); };
            };
            g.onerror=function(){ db.close(); res(); };
          }catch(e){ db.close(); res(); }
        };
      }catch(e){ res(); }
    });
  }
  function logout(){
    var c=cur; setOwn(null); cur=null; renderWho(); showLogin('로그아웃했습니다.');
    if(c && c.token){ call({action:'auLogout', token:c.token}).catch(function(){}); }
    if(c && c.src==='sales') clearSalesLogin();
  }
  function bindAcct(){
    var b=$('acctOut'); if(!b) return;
    b.addEventListener('click', function(){
      if(cur && cur.src==='sales' && !confirm('이 PC의 매출분석도구도 함께 로그아웃됩니다. 로그아웃할까요?')) return;
      logout();
    });
  }
  // 마지막 로그인: 한국 시간 + 며칠 전
  function lastLogin(v){
    if(!v) return '<span style="color:var(--dim)">기록 없음</span>';
    var str=String(v), d=new Date(str), out;
    if(isNaN(d)) return esc(str.slice(0,16));
    if(/[zZ]|[+-]\d\d:?\d\d$/.test(str) || typeof v==='number'){
      var k=new Date(d.getTime()+9*3600e3);
      out=k.getUTCFullYear()+'-'+('0'+(k.getUTCMonth()+1)).slice(-2)+'-'+('0'+k.getUTCDate()).slice(-2)+' '+('0'+k.getUTCHours()).slice(-2)+':'+('0'+k.getUTCMinutes()).slice(-2);
    }else out=str.slice(0,16).replace('T',' ');
    var days=Math.floor((Date.now()-d.getTime())/86400000);
    var rel = days<=0 ? '오늘' : days===1 ? '어제' : days+'일 전';
    return esc(out)+'<small>'+rel+'</small>';
  }

  function openMem(){
    closeDrawer(); $('memModal').classList.add('on');
    body('<div class="note">로그인 확인 중…</div>');
    refreshWho().then(function(c){ if(c) loadList(); else showLogin(''); });
  }
  function closeMem(){ $('memModal').classList.remove('on'); }
  $('memX').addEventListener('click', closeMem);
  $('memModal').addEventListener('click', function(e){ if(e.target===$('memModal')) closeMem(); });
  $('memReload').addEventListener('click', function(){ if(cur) loadList(); else openMem(); });
  $('who').addEventListener('click', openMem);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshWho(); });
  refreshWho();
})();
</script>
</body>
</html>
