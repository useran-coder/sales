<style>
  :root{
    --bg:#000; --card:#111214; --card-h:#1a1c20; --line:#2a2d33;
    --text:#f2f3f5; --sub:#9aa0a8; --dim:#6b7078;
    --sales:#3b82f6; --purchase:#10b981; --cost:#a78bfa; --team:#f472b6; --new:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
:root{--cw:760px}
  @media (max-width:1160px){ :root{--cw:calc(100vw - 400px)} }
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 16px 32px}
  header{text-align:center;margin-bottom:40px}
  .co{font-size:14px;letter-spacing:.2em;color:var(--sub);margin:0 0 10px}
  h1{font-size:30px;margin:0;font-weight:700}
  .today{margin-top:10px;font-size:14px;color:var(--dim)}
  main{width:var(--cw);max-width:100%;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:stretch;gap:16px}
  a.btn{flex:1 1 auto;display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);
        background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:22px 24px;transition:background .15s,transform .15s}
  a.btn:hover,a.btn:focus-visible{background:var(--card-h);transform:translateY(-2px);outline:none}
  .ico{font-size:30px;line-height:1}
  .name{font-size:21px;font-weight:700}
  .url{font-size:12px;color:var(--dim);margin-top:4px}
  .tx{flex:1 1 auto;min-width:0}
  .arrow{margin-left:4px;font-size:22px;color:var(--c)}
  .upd{flex:0 0 210px;align-self:stretch;border-left:1px solid var(--line);
       padding:2px 0 2px 20px;display:flex;flex-direction:column;justify-content:center}
  .upd .lb{font-size:12px;color:var(--sub)}
  .upd .dt{white-space:nowrap;font-size:14px;font-weight:400;margin-top:4px;font-variant-numeric:tabular-nums}
  .upd .meta{font-size:12px;color:var(--sub);margin-top:4px}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#000;background:var(--new);
         border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
  .err{color:#f87171}
  footer{margin-top:auto;padding-top:40px;font-size:12px;color:var(--dim);text-align:center}
  footer button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;
                padding:5px 12px;cursor:pointer;font:inherit;margin-left:8px}
  footer button:hover{color:var(--text)}
  @media (max-width:600px){
    body{padding-top:36px}
    h1{font-size:24px}
    .row{flex-direction:column;gap:0}
    a.btn{border-radius:14px;padding:18px}
    a.btn{flex-wrap:wrap;gap:12px 16px}
    .tx{flex:1 1 0}
    .upd{order:3;flex:1 1 100%;border-left:none;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;
         align-items:baseline;justify-content:flex-start;gap:4px 10px;padding:12px 0 0}
    .upd .dt,.upd .meta{margin-top:0}
  }

  /* 삼선 메뉴 */
  .hb{position:fixed;top:14px;left:14px;z-index:30;width:42px;height:42px;border-radius:10px;
      background:#0d0e10;border:1px solid var(--line);color:var(--text);cursor:pointer;
      display:flex;align-items:center;justify-content:center}
  .hb:hover{background:var(--card-h)}
  .hb svg{width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  .scrim.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:82vw;z-index:50;background:#0d0e10;
          border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s;
          padding:18px 12px;display:flex;flex-direction:column;gap:4px}
  .drawer.on{transform:none}
  .drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px;
              border-bottom:1px solid var(--line);margin-bottom:8px;font-weight:700}
  .drawer .x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
  .mi{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:9px;border:none;
      background:none;color:var(--text);font:inherit;font-size:15px;font-weight:400;cursor:pointer;text-align:left;text-decoration:none}
  .mi:hover{background:var(--card-h)}
  .msec{font-size:11px;color:var(--dim);padding:4px 12px 4px;letter-spacing:.05em}
  /* Member 창 — 오른쪽에서 밀려 나옴 */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.on{opacity:1;pointer-events:auto}
  .mbox{position:absolute;top:0;right:0;bottom:0;width:520px;max-width:100vw;display:flex;flex-direction:column;
        background:#0d0e10;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease}
  .modal.on .mbox{transform:none}
  /* 우측 상단 로그인 상태 */
  .who{position:fixed;top:14px;right:14px;z-index:30;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 6px;
       border-radius:21px;background:#0d0e10;border:1px solid var(--line);color:var(--text);cursor:pointer;font:inherit;font-size:14px}
  .who:hover{background:var(--card-h)}
  .who .av{width:30px;height:30px;border-radius:50%;background:#1f2937;display:flex;align-items:center;justify-content:center;
           font-size:13px;font-weight:700;color:#e5e7eb}
  .who.in .av{background:#2563eb;color:#fff}
  .who .dot{width:8px;height:8px;border-radius:50%;background:#6b7078}
  .who.in .dot{background:#22c55e}
  .who .rl{font-size:11px;color:var(--sub)}
  .acct{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .acct .av{width:40px;height:40px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .acct .nm{font-weight:700}
  .acct .sm{font-size:12px;color:var(--sub);margin-top:2px}
  .acct button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
  .acct button:hover{color:var(--text)}
  .mbody td.ll{color:var(--sub);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .mbody td.ll small{display:block;color:var(--dim);font-size:11px}
  @media (max-width:600px){ .who .nmt,.who .rl{display:none} .who{padding:0 6px} }
  .mhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .mhead h2{margin:0;font-size:18px}
  .mhead .cnt{font-size:13px;color:var(--sub)}
  .mhead .x{margin-left:auto;background:none;border:none;color:var(--sub);font-size:22px;cursor:pointer}
  .mbody{padding:14px 18px;overflow:auto;flex:1}
  .mbody table{width:100%;border-collapse:collapse;font-size:14px}
  .mbody th.msrt{cursor:pointer;user-select:none;white-space:nowrap}
  .mbody th.msrt:hover,.mbody th.msrt.on{color:var(--text)}
  .mbody th.msrt i{font-style:normal;font-size:10px;margin-left:3px}
  .mbody th{text-align:left;font-size:12px;color:var(--sub);font-weight:600;padding:8px;border-bottom:1px solid var(--line);
            position:sticky;top:-14px;background:var(--card)}
  .mbody td{padding:9px 8px;border-bottom:1px solid #1f2227}
  .mbody td.no{color:var(--dim);width:36px;font-variant-numeric:tabular-nums}
  .mbody td.id{font-weight:700;font-family:ui-monospace,Consolas,monospace}
  .tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;border:1px solid var(--line);color:var(--sub)}
  .tag.adm{color:#fbbf24;border-color:#78591a}
  .tag.off{color:#f87171;border-color:#7f2d2d}
  .tag.pend{color:#60a5fa;border-color:#1e3a8a}
  .note{font-size:13px;color:var(--sub);line-height:1.6}
  .lf{display:flex;flex-direction:column;gap:8px;margin-top:12px}

<script>
(function(){
  'use strict';
  var OWNER = 'useran-coder';
  var TOOLS = [
    { key:'sales',    name:'매출 분석 도구', icon:'📈', color:'var(--sales)',
      url:'https://useran-coder.github.io/sales/',    repo:'sales' },
    { key:'purchase', name:'매입 분석 도구', icon:'📦', color:'var(--purchase)',
      url:'https://useran-coder.github.io/purchase/', repo:'purchase' },
    { key:'cost',     name:'가공비 견적기',  icon:'🧮', color:'var(--cost)',
      url:'https://useran-coder.github.io/cost/',     repo:'cost' },
    { key:'salesteam', name:'영업팀 업무분석', icon:'👥', color:'var(--team)',
      url:'https://useran-coder.github.io/salesteam/', repo:'salesteam' }
  ];
  var CACHE_KEY = 'dbfHomeUpd_v3';
  var CACHE_MS = 10 * 60 * 1000;   // 10분 안에는 다시 묻지 않음 (GitHub 무료 조회 한도 보호)
  var WD = ['일','월','화','수','목','금','토'];

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'') + n; }
  function kst(d){ // 한국 시간 기준 날짜 조각
    var k = new Date(d.getTime() + 9*3600*1000);
    return { y:k.getUTCFullYear(), m:k.getUTCMonth()+1, d:k.getUTCDate(), w:k.getUTCDay(),
             h:k.getUTCHours(), mi:k.getUTCMinutes() };
  }
  function fmtDate(d){ var p=kst(d); return p.y+'-'+pad(p.m)+'-'+pad(p.d)+' ('+WD[p.w]+')'; }
  function fmtTime(d){ var p=kst(d); return pad(p.h)+':'+pad(p.mi); }
  function dayDiff(d){
    var a=kst(d), b=kst(new Date());
    return Math.round((Date.UTC(b.y,b.m-1,b.d) - Date.UTC(a.y,a.m-1,a.d)) / 86400000);
  }
  function ago(n){ return n<=0 ? '오늘' : n===1 ? '어제' : n+'일 전'; }
  function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
  function writeCache(v){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(v)); }catch(e){} }

  var p = kst(new Date());
  $('today').textContent = '오늘 ' + p.y + '년 ' + p.m + '월 ' + p.d + '일 (' + WD[p.w] + ')';

  // 화면 그리기
  var list = $('list');
  TOOLS.forEach(function(t){
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<a class="btn" style="--c:'+t.color+'" href="'+t.url+'" target="_blank" rel="noopener">' +
        '<span class="ico">'+t.icon+'</span>' +
        '<span class="tx"><div class="name">'+t.name+'</div><div class="url">'+t.url.replace('https://','')+'</div></span>' +
        '<span class="upd" id="upd-'+t.key+'"><span class="lb">마지막 업데이트</span>' +
        '<span class="dt">확인 중…</span><span class="meta"></span></span>' +
        '<span class="arrow">→</span></a>';
    list.appendChild(row);
  });

  function show(t, info){
    var box = $('upd-'+t.key);
    var dt = box.querySelector('.dt'), meta = box.querySelector('.meta');
    if(!info || !info.date){
      dt.innerHTML = '<span class="err">확인 못 함</span>';
      meta.textContent = '잠시 후 «새로 확인»';
      return;
    }
    var d = new Date(info.date), n = dayDiff(d);
    dt.innerHTML = fmtDate(d) + (n<=0 ? '<span class="badge">NEW</span>' : '');
    meta.textContent = fmtTime(d) + ' · ' + ago(n) + (info.ver ? ' · ' + info.ver : '');
  }

  // 파일 앞부분(약 40KB)만 읽고 끊기 → 버전 번호 찾기
  function headText(resp){
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    if(!resp.body || !resp.body.getReader) return resp.text().then(function(s){ return s.slice(0,40000); });
    var rd = resp.body.getReader(), dec = new TextDecoder('utf-8'), out = '';
    function pump(){
      return rd.read().then(function(r){
        if(r.value) out += dec.decode(r.value, {stream:true});
        if(r.done || out.length >= 40000){ try{ rd.cancel(); }catch(e){} return out; }
        return pump();
      });
    }
    return pump();
  }
  function findVer(s){
    var m = /APP_BUILD\s*=\s*['"](v\d+)['"]/.exec(s) || /<title>[^<]*?(v\d+)\s*<\/title>/.exec(s);
    return m ? m[1] : '';
  }

  // ① 기본: 같은 github.io 주소의 배포 파일 머리(Last-Modified = 배포 시각) — 조회 한도 없음
  // v2: 브라우저 저장소(HTTP 캐시)에 아예 쓰지 않고(no-store), 40KB 읽으면 연결을 확실히 끊음(abort).
  //     전에는 6MB 도구 파일을 캐시에 쓰다 만 상태로 남겨, 버튼을 처음 누르면 새 탭이
  //     그 캐시 기록이 끝나기를 기다리며 하얀 화면으로 멈춰 있었음.
  function viaPages(t){
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 15000) : null;
    return fetch(t.url, {headers:{Range:'bytes=0-40000'}, cache:'no-store', signal: ctl?ctl.signal:undefined}).then(function(r){
      var lm = r.headers.get('Last-Modified');
      return headText(r).then(function(s){
        if(ctl) ctl.abort();
        if(timer) clearTimeout(timer);
        if(!lm) throw new Error('no Last-Modified');
        return { date:new Date(lm).toISOString(), ver:findVer(s) };
      });
    }).catch(function(e){ if(timer) clearTimeout(timer); throw e; });
  }
  // ② 예비: GitHub API(1시간 60회 한도) + raw 파일 머리
  function viaApi(t){
    var api = 'https://api.github.com/repos/'+OWNER+'/'+t.repo+'/commits?path=index.html&per_page=1';
    var raw = 'https://raw.githubusercontent.com/'+OWNER+'/'+t.repo+'/main/index.html';
    var commit = fetch(api, {headers:{Accept:'application/vnd.github+json'}})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(a){
        var c = a && a[0] && a[0].commit; if(!c) throw new Error('no commit');
        var m = /(?:st-)?v\d{2,5}/.exec(c.message||'');
        return { date:(c.committer||c.author).date, verMsg: m ? m[0] : '' };
      });
    var ver = fetch(raw, {headers:{Range:'bytes=0-40000'}, cache:'no-store'})
      .then(headText).then(findVer).catch(function(){ return ''; });
    return Promise.all([commit, ver]).then(function(r){
      return { date:r[0].date, ver: r[1] || r[0].verMsg };
    });
  }
  var ON_PAGES = /\.github\.io$/i.test(location.hostname);
  function fetchTool(t){
    if(!ON_PAGES) return viaApi(t);
    return viaPages(t).then(function(info){
      if(info.ver) return info;
      // 파일 안에 버전이 없는 도구(영업팀 업무분석)는 커밋 메시지에서만 버전 보충
      return viaApi(t).then(function(a){ return { date:info.date, ver:a.ver }; }, function(){ return info; });
    }, function(){ return viaApi(t); });
  }

  function load(force){
    var cache = readCache() || {};
    var fresh = !force && cache.at && (Date.now() - cache.at < CACHE_MS);
    if(fresh){
      TOOLS.forEach(function(t){ show(t, cache.data && cache.data[t.key]); });
      $('checked').textContent = fmtTime(new Date(cache.at)) + ' 확인';
      return;
    }
    TOOLS.forEach(function(t){ $('upd-'+t.key).querySelector('.dt').textContent = '확인 중…'; });
    var data = {}, okAll = true;
    Promise.all(TOOLS.map(function(t){
      return fetchTool(t).then(function(info){ data[t.key] = info; show(t, info); })
        .catch(function(){
          okAll = false;
          var old = cache.data && cache.data[t.key];   // 실패하면 지난 확인값이라도 표시
          data[t.key] = old || null;
          show(t, old);
          if(old) $('upd-'+t.key).querySelector('.meta').textContent += ' (지난 확인값)';
        });
    })).then(function(){
      if(okAll){ writeCache({at:Date.now(), data:data}); }
      $('checked').textContent = fmtTime(new Date()) + ' 확인' + (okAll ? '' : ' (일부 실패)');
    });
  }

  $('reload').addEventListener('click', function(){ load(true); });

  // 버튼에 마우스를 올리거나 손가락을 대는 순간 그 도구 파일을 미리 받아 둠 → 눌렀을 때 바로 열림
  var warmed = {};
  function warm(url){
    if(warmed[url]) return; warmed[url] = 1;
    try{ var l=document.createElement('link'); l.rel='prefetch'; l.href=url; l.as='document'; document.head.appendChild(l); }catch(e){}
  }
  document.querySelectorAll('a.btn').forEach(function(a){
    ['pointerenter','touchstart','focus'].forEach(function(ev){
      a.addEventListener(ev, function(){ warm(a.href); }, {passive:true});
    });
  });

  // ── 화면을 켜 둔 동안 새 버전이 배포되면 알림 카드(매출분석도구와 같은 모양) ──
  var known = {};          // 지금 화면에 보이는 도구별 배포 시각·버전
  var pendUpd = {};        // 아직 반영 안 한 새 버전 {key:{info, old}}
  var selfLM = '', selfNew = '', laterUntil = 0, lastChk = Date.now(), chkBusy = false;
  var CHK_MS = 3 * 60 * 1000;
  var _show = show;
  show = function(t, info){
    if(info && info.date){
      known[t.key] = {date:info.date, ver:info.ver||''};
      var p = pendUpd[t.key];   // «새로 확인»으로 이미 화면에 반영됐으면 알림에서 뺌
      if(p && new Date(info.date).getTime() >= new Date(p.info.date).getTime()){ delete pendUpd[t.key]; setTimeout(paintNote, 0); }
    }
    _show(t, info);
  };
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function md(d){ var p=kst(d); return p.m+'/'+p.d+' '+pad(p.h)+':'+pad(p.mi); }
  function selfHead(){
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 15000) : null;
    return fetch(location.href.split('#')[0], {headers:{Range:'bytes=0-1000'}, cache:'no-store', signal: ctl?ctl.signal:undefined})
      .then(function(r){ var lm = r.ok ? (r.headers.get('Last-Modified')||'') : ''; if(ctl) ctl.abort(); if(timer) clearTimeout(timer); return lm; })
      .catch(function(){ if(timer) clearTimeout(timer); return ''; });
  }
  function note(){
    var n = $('updNote');
    if(!n){
      n = document.createElement('div'); n.id = 'updNote'; n.setAttribute('role','alert');
      n.innerHTML = '<div class="u-hd"><div class="u-ic">🔔</div><div><div class="u-ti"></div><div class="u-st"></div></div>'
        + '<button type="button" class="u-x u-later" title="나중에">✕</button></div><div class="u-list"></div>'
        + '<div class="u-ft"><button type="button" class="u-later">나중에</button><button type="button" class="u-go">지금 업데이트</button></div>';
      document.body.appendChild(n);
    }
    return n;
  }
  function paintNote(){
    var keys = Object.keys(pendUpd), n = note();
    var cnt = keys.length + (selfNew ? 1 : 0);
    if(!cnt || Date.now() < laterUntil){ n.style.display = 'none'; return; }
    n.querySelector('.u-ti').textContent = '새 버전이 배포되었습니다 ' + cnt + '건';
    n.querySelector('.u-st').textContent = selfNew ? '«지금 업데이트»를 누르면 홈페이지를 새로 엽니다'
      : '«지금 업데이트»를 누르면 업데이트 일자에 반영됩니다';
    var rows = [];
    if(selfNew) rows.push('<div class="u-row"><span class="u-cat home">홈페이지</span><div class="u-d">업무분석도구 홈페이지 새 버전</div>'
      + '<div class="u-m">' + esc(md(new Date(selfNew))) + ' 배포</div></div>');
    TOOLS.forEach(function(t){
      var u = pendUpd[t.key]; if(!u) return;
      var v = u.info.ver, ov = u.old && u.old.ver;
      var d = v ? ((ov && ov !== v) ? ov + ' → ' + v : v) + ' 새 버전' : '새 버전';
      rows.push('<div class="u-row"><span class="u-cat ' + t.key + '">' + esc(t.name) + '</span><div class="u-d">' + esc(d) + '</div>'
        + '<div class="u-m">' + esc(md(new Date(u.info.date))) + ' 배포 · 도구를 다시 열면 새 버전이 적용됩니다</div></div>');
    });
    n.querySelector('.u-list').innerHTML = rows.join('');
    n.style.display = 'flex';
  }
  function applyUpd(){
    if(selfNew){ location.reload(); return; }
    var c = readCache() || {}; c.data = c.data || {};
    TOOLS.forEach(function(t){ var u = pendUpd[t.key]; if(u){ show(t, u.info); c.data[t.key] = u.info; } });
    if(c.at) writeCache(c);
    pendUpd = {}; $('checked').textContent = fmtTime(new Date()) + ' 확인'; paintNote();
  }
  function check(){
    if(chkBusy || !ON_PAGES) return;
    chkBusy = true; lastChk = Date.now();
    var jobs = TOOLS.map(function(t){
      return viaPages(t).then(function(info){
        var k = known[t.key];
        if(!k || !info.date || new Date(info.date).getTime() <= new Date(k.date).getTime()) return;
        var p = pendUpd[t.key];
        if(p && p.info.date === info.date) return;
        var full = info.ver ? Promise.resolve(info)
          : viaApi(t).then(function(a){ return {date:info.date, ver:a.ver}; }, function(){ return info; });   // 영업팀: 버전은 커밋 메시지
        return full.then(function(fi){ pendUpd[t.key] = {info:fi, old:k}; });
      }).catch(function(){});
    });
    jobs.push(selfHead().then(function(lm){
      if(!lm) return;
      if(!selfLM){ selfLM = lm; return; }
      if(lm !== selfLM && new Date(lm).getTime() > new Date(selfLM).getTime()) selfNew = lm;
    }));
    Promise.all(jobs).then(function(){ chkBusy = false; paintNote(); });
  }
  document.addEventListener('click', function(e){
    var t = e.target; if(!t || !t.closest) return;
    if(t.closest('#updNote .u-go')){ e.preventDefault(); applyUpd(); }
    else if(t.closest('#updNote .u-later')){ e.preventDefault(); laterUntil = Date.now() + 10*60*1000; paintNote(); setTimeout(paintNote, 10*60*1000 + 500); }
  }, true);
  setInterval(function(){ if(document.visibilityState === 'visible') check(); }, CHK_MS);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && Date.now() - lastChk > 60*1000) check();
  });
  if(ON_PAGES) selfHead().then(function(lm){ if(lm && !selfLM) selfLM = lm; });
  window.__homeUpd = { check:check, state:function(){ return {known:known, pend:pendUpd, selfLM:selfLM, selfNew:selfNew}; } };

  load(false);
})();
</script>
<script>

   계정은 매출분석도구 로그인 서버와 같습니다. 같은 github.io 주소라서
   매출분석도구에 로그인해 둔 PC는 그 로그인을 그대로 씁니다(읽기만, 바꾸지 않음). */
(function(){
  'use strict';
  var AU_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbxSlND4ZKOpxISNQMRdV2d-LA5YxXS1BDe0k2TXKq6g7Tfm6PZ1Rse3mp0Nm4ndZXZdiQ/exec';
  var AU_KEY = 'dbang2026!';
  var SS_KEY = 'dbfHomeAu_v1';
  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function auUrl(){
    try{ var v=String(localStorage.getItem('au_url_override_v745')||'').trim();
      if(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v) && v.indexOf('AKfycbyEjIY0')<0) return v; }catch(e){}
    return AU_URL_DEFAULT;
  }

  // 메뉴 열고 닫기
  function openDrawer(){ $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
  function closeDrawer(){ $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); }
  $('hb').addEventListener('click', openDrawer);
  $('drawerX').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ if($('memModal').classList.contains('on')) closeMem(); else closeDrawer(); }
  });
  // 바로가기 링크(본문 버튼과 같은 목록)
  document.querySelectorAll('a.btn').forEach(function(a){
    var l=document.createElement('a'); l.className='mi'; l.href=a.href; l.target='_blank'; l.rel='noopener';
    l.textContent=(a.querySelector('.ico')||{}).textContent+' '+(a.querySelector('.name')||{}).textContent;
    $('drawerLinks').appendChild(l);
  });

  // 매출분석도구가 이 PC에 저장해 둔 로그인 읽기 (DB가 없으면 만들지 않음)
  function readSalesLogin(){
    return new Promise(function(res){
      try{
        var created=false, rq=indexedDB.open('dbpastec_sales');
        rq.onupgradeneeded=function(){ created=true; try{ rq.transaction.abort(); }catch(e){} };
        rq.onerror=function(){ res(null); };
        rq.onsuccess=function(){
          var db=rq.result;
          if(created || !db.objectStoreNames.contains('kv')){ db.close(); return res(null); }
          try{
            var g=db.transaction('kv','readonly').objectStore('kv').get('auth_v1');
            g.onsuccess=function(){ db.close(); res(g.result||null); };
            g.onerror=function(){ db.close(); res(null); };
          }catch(e){ db.close(); res(null); }
        };
      }catch(e){ res(null); }
    });
  }
  function valid(a){ return !!(a && a.token && a.exp && Date.now() < a.exp); }
  function getOwn(){ try{ return JSON.parse(sessionStorage.getItem(SS_KEY)||'null'); }catch(e){ return null; } }
  function setOwn(v){ try{ v?sessionStorage.setItem(SS_KEY,JSON.stringify(v)):sessionStorage.removeItem(SS_KEY); }catch(e){} }

  function call(payload){
    payload.key = AU_KEY;
    var ctl = window.AbortController ? new AbortController() : null;
    var t = ctl ? setTimeout(function(){ ctl.abort(); }, 25000) : null;
    return fetch(auUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload), signal: ctl?ctl.signal:undefined})
      .then(function(r){ return r.text(); })
      .then(function(tx){
        if(t) clearTimeout(t);
        var d; try{ d=JSON.parse(tx); }catch(e){ throw new Error('서버 응답을 읽지 못했습니다.'); }
        if(d && d.error) throw new Error(String(d.error));
        return d;
      }, function(e){
        if(t) clearTimeout(t);
        throw new Error(e && e.name==='AbortError' ? '서버가 25초 안에 응답하지 않았습니다.' : '서버에 연결하지 못했습니다.');
      });
  }

  var ROLE = {admin:'관리자', uploader:'업로더', user:'일반'};
  var cur = null;   // 지금 쓰는 로그인 {token,id,name,role,exp,src}

  function body(h){ $('memBody').innerHTML = h; }
  function showLogin(msg){
    $('memCnt').textContent=''; $('memFoot').style.display='none';
    body('<div class="note">'+(msg?esc(msg)+'<br>':'')+
      '매출분석도구와 같은 아이디로 로그인하세요. 관리자 계정만 목록을 볼 수 있습니다.</div>'+
      '<form class="lf" id="memLogin" autocomplete="on">'+
      '<input id="mlId" name="username" placeholder="아이디" autocomplete="username" required>'+
      '<input id="mlPw" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>'+
      '<button id="mlBtn" type="submit">로그인</button><div class="note" id="mlMsg" style="color:#f87171"></div></form>');
    $('memLogin').addEventListener('submit', function(e){
      e.preventDefault();
      var id=$('mlId').value.trim(), pw=$('mlPw').value;
      if(!id||!pw) return;
      $('mlBtn').disabled=true; $('mlBtn').textContent='확인 중…'; $('mlMsg').textContent='';
      call({action:'auLogin', id:id, pw:pw}).then(function(d){
        if(!d || !d.token || !d.user) throw new Error('로그인하지 못했습니다.');
        cur = {token:d.token, id:d.user.id, name:d.user.name, role:d.user.role, exp:d.exp, src:'own'};
        setOwn(cur); renderWho(); loadList();
      }).catch(function(err){
        $('mlMsg').textContent = err.message; $('mlBtn').disabled=false; $('mlBtn').textContent='로그인';
      });
    });
    setTimeout(function(){ var i=$('mlId'); if(i) i.focus(); }, 50);
  }

  function loadList(){
    if(cur && cur.role && cur.role!=='admin'){
      return showLogin((cur.name||cur.id)+'님은 '+(ROLE[cur.role]||cur.role)+' 권한이라 목록을 볼 수 없습니다.');
    }
    $('memFoot').style.display='';
    body('<div class="note">불러오는 중…</div>'); $('memCnt').textContent='';
    call({action:'auList', token:cur.token, fresh:Date.now()}).then(function(d){
      var all = (d && d.users) || [];
      all.sort(function(a,b){ return (b.pending?1:0)-(a.pending?1:0) || String(a.name||a.id).localeCompare(String(b.name||b.id),'ko'); });
      $('memCnt').textContent = all.length+'명';
      if(!all.length) return body(acctCard()+'<div class="note">등록된 사람이 없습니다.</div>');
      all.forEach(function(u,i){ u._no=i+1; var t=u.lastLogin?new Date(String(u.lastLogin)).getTime():NaN; u._ll=isNaN(t)?-1:t; });
      MS.list=all; drawMem();
    }).catch(function(err){
      if(/토큰|로그인|만료|권한|token|auth/i.test(err.message)){
        if(cur && cur.src==='own') setOwn(null);
        cur=null; renderWho(); return showLogin(err.message);
      }
      body('<div class="note" style="color:#f87171">'+esc(err.message)+'</div>');
    });
  }
  // 회원 표: 제목(#·아이디·이름·마지막 로그인)을 누르면 정렬, 한 번 더 누르면 반대로
  var MS={list:[], k:'_no', dir:1};
  var MCOLS=[{k:'_no',h:'#'},{k:'id',h:'아이디'},{k:'name',h:'이름'},{k:'_ll',h:'마지막 로그인'}];
  function drawMem(){
    var all=MS.list.slice(), k=MS.k, dir=MS.dir;
    all.sort(function(a,b){ var x=a[k], y=b[k];
      if(k==='_no'||k==='_ll') return ((x||0)-(y||0))*dir || (a._no-b._no);
      return String(x||a.id||'').localeCompare(String(y||b.id||''),'ko')*dir; });
    {
      body(acctCard()+'<table><thead><tr>'+MCOLS.map(function(c){ var on=MS.k===c.k; return '<th class="msrt'+(on?' on':'')+'" data-mk="'+c.k+'">'+c.h+'<i>'+(on?(MS.dir>0?'▲':'▼'):'')+'</i></th>'; }).join('')+'</tr></thead><tbody>'+
        all.map(function(u,i){
          var tags='';
          if(u.pending) tags+='<span class="tag pend">승인 대기</span>';
          else if(u.active===false) tags+='<span class="tag off">사용중지</span>';
          if(u.role==='admin') tags+='<span class="tag adm">관리자</span>';
          else if(u.role==='uploader') tags+='<span class="tag">업로더</span>';
          return '<tr><td class="no">'+u._no+'</td><td class="id">'+esc(u.id)+'</td><td>'+esc(u.name||'')+tags+'</td><td class="ll">'+lastLogin(u.lastLogin)+'</td></tr>';
        }).join('')+'</tbody></table>'+
        '<div class="note" style="margin-top:10px">계정 추가·삭제·권한 변경은 매출분석도구 관리자 메뉴에서 합니다. 제목을 누르면 정렬됩니다.</div>');
      bindAcct();
      $('memBody').querySelectorAll('th[data-mk]').forEach(function(th){ th.addEventListener('click', function(){
        var k=th.getAttribute('data-mk'); if(MS.k===k) MS.dir=-MS.dir; else { MS.k=k; MS.dir=(k==='_ll')?-1:1; } drawMem(); }); });
    }
  }

  // 지금 로그인 상태 찾기: 이 화면 로그인 → 매출분석도구 로그인 순서
  function resolveLogin(){
    var own=getOwn();
    if(valid(own)) return Promise.resolve(own);
    return readSalesLogin().then(function(a){
      return valid(a) ? {token:a.token,id:a.id,name:a.name,role:a.role,exp:a.exp,src:'sales'} : null;
    });
  }
  function initial(n){ n=String(n||'').trim(); return n ? n.charAt(0).toUpperCase() : '?'; }
  function renderWho(){
    var w=$('who');
    if(cur){
      w.classList.add('in');
      $('whoAv').textContent=initial(cur.name||cur.id);
      $('whoName').textContent=cur.name||cur.id;
      $('whoRole').textContent=ROLE[cur.role]||'';
      w.title=(cur.name||cur.id)+' ('+cur.id+') 로그인 중'+(cur.src==='sales'?' · 매출분석도구 로그인 사용':'');
    }else{
      w.classList.remove('in');
      $('whoAv').textContent='?'; $('whoName').textContent='로그인'; $('whoRole').textContent=''; w.title='로그인하지 않음';
    }
  }
  function refreshWho(){ return resolveLogin().then(function(c){ cur=c; renderWho(); return c; }); }
  function acctCard(){
    if(!cur) return '';
    var left = Math.max(0, Math.round((cur.exp-Date.now())/60000));
    var leftTxt = left>=60 ? Math.floor(left/60)+'시간 '+(left%60)+'분' : left+'분';
    return '<div class="acct"><span class="av">'+esc(initial(cur.name||cur.id))+'</span><div>'+
      '<div class="nm">'+esc(cur.name||'')+' <span class="tag adm">'+esc(ROLE[cur.role]||cur.role||'')+'</span></div>'+
      '<div class="sm">'+esc(cur.id)+' · 로그인 남은 시간 '+leftTxt+(cur.src==='sales'?' · 매출분석도구 로그인 사용':'')+'</div></div>'+
      '<button type="button" id="acctOut">로그아웃</button></div>';
  }
  // 로그아웃: 서버에 알리고(실패해도 진행) 이 화면·매출분석도구 로그인 모두 지움(서버 주소는 남김)
  function clearSalesLogin(){
    return new Promise(function(res){
      try{
        var created=false, rq=indexedDB.open('dbpastec_sales');
        rq.onupgradeneeded=function(){ created=true; try{ rq.transaction.abort(); }catch(e){} };
        rq.onerror=function(){ res(); };
        rq.onsuccess=function(){
          var db=rq.result;
          if(created || !db.objectStoreNames.contains('kv')){ db.close(); return res(); }
          try{
            var st=db.transaction('kv','readwrite').objectStore('kv'), g=st.get('auth_v1');
            g.onsuccess=function(){
              var v=g.result||{};
              var put=st.put({token:'',id:'',name:'',role:'',exp:0,urlOverride:v.urlOverride||''},'auth_v1');
              put.onsuccess=function(){ db.close(); res(); };
              put.onerror=function(){ db.close(); res(); };
            };
            g.onerror=function(){ db.close(); res(); };
          }catch(e){ db.close(); res(); }
        };
      }catch(e){ res(); }
    });
  }
  function logout(){
    var c=cur; setOwn(null); cur=null; renderWho(); showLogin('로그아웃했습니다.');
    if(c && c.token){ call({action:'auLogout', token:c.token}).catch(function(){}); }
    if(c && c.src==='sales') clearSalesLogin();
  }
  function bindAcct(){
    var b=$('acctOut'); if(!b) return;
    b.addEventListener('click', function(){
      if(cur && cur.src==='sales' && !confirm('이 PC의 매출분석도구도 함께 로그아웃됩니다. 로그아웃할까요?')) return;
      logout();
    });
  }
  // 마지막 로그인: 한국 시간 + 며칠 전
  function lastLogin(v){
    if(!v) return '<span style="color:var(--dim)">기록 없음</span>';
    var str=String(v), d=new Date(str), out;
    if(isNaN(d)) return esc(str.slice(0,16));
    if(/[zZ]|[+-]\d\d:?\d\d$/.test(str) || typeof v==='number'){
      var k=new Date(d.getTime()+9*3600e3);
      out=k.getUTCFullYear()+'-'+('0'+(k.getUTCMonth()+1)).slice(-2)+'-'+('0'+k.getUTCDate()).slice(-2)+' '+('0'+k.getUTCHours()).slice(-2)+':'+('0'+k.getUTCMinutes()).slice(-2);
    }else out=str.slice(0,16).replace('T',' ');
    var days=Math.floor((Date.now()-d.getTime())/86400000);
    var rel = days<=0 ? '오늘' : days===1 ? '어제' : days+'일 전';
    return esc(out)+'<small>'+rel+'</small>';
  }

  function openMem(){
    closeDrawer(); $('memModal').classList.add('on');
    body('<div class="note">로그인 확인 중…</div>');
    refreshWho().then(function(c){ if(c) loadList(); else showLogin(''); });
  }
  function closeMem(){ $('memModal').classList.remove('on'); }
  $('memX').addEventListener('click', closeMem);
  $('memModal').addEventListener('click', function(e){ if(e.target===$('memModal')) closeMem(); });
  $('memReload').addEventListener('click', function(){ if(cur) loadList(); else openMem(); });
  $('who').addEventListener('click', openMem);
  window.__home = { getCur:function(){ return cur; }, refreshWho:refreshWho, openMem:openMem, call:call };
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshWho(); });
  refreshWho();
})();
</script>
<script>
/* ── 상단 검색 v2: 매출(제품단가·업체별 단가) · 매입(제품 매입단가·업체별 매입단가) ──
   자료: 매출 = 이 PC 매출분석도구 저장자료(없으면 서버 공유자료), 매입 = 이 PC 매입분석도구 저장자료.
   같은 github.io 주소라 바로 읽고, 읽기만 합니다. 로그인한 사람만 검색할 수 있습니다. */
(function(){
  'use strict';
  var AU_KEY='dbang2026!';
  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function won(n){ return Math.round(+n||0).toLocaleString('ko-KR'); }
  function num(n){ n=+n||0; return (Math.round(n*100)/100).toLocaleString('ko-KR'); }
  function ymd(t){ var d=new Date(t); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }
  function auUrl(){
    try{ var v=String(localStorage.getItem('au_url_override_v745')||'').trim();
      if(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v) && v.indexOf('AKfycbyEjIY0')<0) return v; }catch(e){}
    return 'https://script.google.com/macros/s/AKfycbxSlND4ZKOpxISNQMRdV2d-LA5YxXS1BDe0k2TXKq6g7Tfm6PZ1Rse3mp0Nm4ndZXZdiQ/exec';
  }
  var MODES={
    sp:{src:'sales', kind:'prod', title:'매출 제품단가', party:'업체', ph:'품번 · 품명 · 규격'},
    sc:{src:'sales', kind:'party',title:'매출 업체별 단가', party:'업체', ph:'업체명'},
    pp:{src:'purch', kind:'prod', title:'매입 제품단가', party:'매입처', ph:'품번 · 품명 · 규격'},
    pc:{src:'purch', kind:'party',title:'매입 업체별 단가', party:'매입처', ph:'매입처명'},
    co:{src:'co', kind:'co', title:'업체 검색', party:'업체', ph:'업체명 · 대표자 · 사업자번호 · 전화 · 주소'},
    bom:{src:'bom', kind:'bom', title:'사용 제품=원자재', party:'', ph:'제품(품번·품명·규격) 또는 원자재(EGI 1.6 · STS430)'},
    ar:{src:'ar', kind:'ar', title:'미수관리', party:'업체', ph:'업체명 · 영업담당 (전체 = 미수 업체 모두)'}
  };
  $('sMode').addEventListener('change', function(){ $('sQ').placeholder=MODES[this.value].ph; $('sQ').focus(); });
  // 검색 종류 목록(구분선이 잘 보이게 직접 그림). 키보드 ↑↓ 는 기본 선택상자 그대로 동작
  (function(){
    var sel=$('sMode'), m=document.createElement('div'); m.className='smenu'; m.setAttribute('role','listbox');
    m.innerHTML=[].map.call(sel.children,function(c){ return c.tagName==='HR'?'<div class="sep"></div>':'<button type="button" data-v="'+c.value+'">'+esc(c.textContent)+'</button>'; }).join('');
    sel.parentNode.appendChild(m);
    function open(){ m.style.left=sel.offsetLeft+'px'; m.style.minWidth=sel.offsetWidth+'px';
      m.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===sel.value); }); m.classList.add('on'); }
    function close(){ m.classList.remove('on'); }
    sel.addEventListener('mousedown', function(e){ e.preventDefault(); sel.focus(); m.classList.contains('on')?close():open(); });
    sel.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    m.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return; sel.value=b.getAttribute('data-v'); close(); sel.dispatchEvent(new Event('change',{bubbles:true})); });
    document.addEventListener('mousedown', function(e){ if(!m.contains(e.target) && e.target!==sel) close(); });
  })();

  /* ── 결과 창 / 오른쪽 이력 창 ── */
  function show(html){ $('srin').innerHTML=html; $('sr').classList.add('on'); }
  function hide(){ $('sr').classList.remove('on'); closeHist(); }
  function head(title,cnt){ return '<div class="srh"><span class="t">'+title+'</span><span class="c">'+(cnt||'')+'</span><button type="button" class="x" id="srX">닫기</button></div>'; }
  document.addEventListener('click', function(e){ if(e.target && e.target.id==='srX') hide(); });
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape' || document.querySelector('.modal.on')) return;
    if($('hp').classList.contains('on')) closeHist(); else if($('sr').classList.contains('on')) hide();
  });
  function openHist(html){ $('hpBody').innerHTML=html; $('hp').classList.add('on'); $('hpBody').scrollTop=0; }
  function closeHist(){ $('hp').classList.remove('on'); }
  $('hpX').addEventListener('click', closeHist);
  function pnorm(s){ return norm(s).replace(/\(주\)|㈜|주식회사|\(유\)|유한회사/g,''); }
  function setPF(v, exact){ HP.pf=v||''; HP.pfx=!!exact; $('hpQ').value=HP.pf; $('hpQw').classList.toggle('has', !!HP.pf); }
  $('hpQ').addEventListener('input', function(){ if(!HP) return; HP.pf=this.value.trim(); HP.pfx=false; $('hpQw').classList.toggle('has', !!this.value); drawHist(); });
  $('hpQx').addEventListener('click', function(){ if(!HP) return; setPF(''); drawHist(); $('hpQ').focus(); });
  $('hp').addEventListener('click', function(e){ if(e.target===$('hp')) closeHist(); });

  /* ── 자료 정리 ── */
  function toDate(d){
    if(d instanceof Date) return isNaN(d)?null:d;
    if(typeof d==='number'){ if(d>=19000101&&d<=99991231){ var s8=String(d); return new Date(+s8.slice(0,4),+s8.slice(4,6)-1,+s8.slice(6,8)); }
      if(d>20000&&d<80000) return new Date(Math.round((d-25569)*86400000)); return new Date(d); }
    var s=String(d||'').trim(); if(!s) return null;
    var m=/^(\d{4})[-./]?(\d{1,2})[-./]?(\d{1,2})/.exec(s); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
    var x=new Date(s); return isNaN(x)?null:x;
  }
  function prep(list, partyKey){
    var out=[];
    for(var i=0;i<list.length;i++){
      var r=list[i]; if(!r) continue; var d=toDate(r.d); if(!d) continue;
      var qty=+r.qty||0, sup=+r.supply||0, pr=+r.price||0; if(!pr && qty) pr=sup/qty;
      var party=String(r[partyKey]||'').trim();
      out.push({t:d.getTime(), y:d.getFullYear(), party:party, code:String(r.code||'').trim(), name:String(r.name||'').trim(), spec:String(r.spec||'').trim(),
        qty:qty, price:pr, supply:sup, ok:(qty>0&&pr>0),
        pk:norm(r.code)+' '+norm(r.name)+' '+norm(r.spec), ck:norm(party)});

  function readIdb(dbName, key){

  function flat(v){ if(!Array.isArray(v)) return null; var all=[]; v.forEach(function(ds){ if(ds&&Array.isArray(ds.recs)) all=all.concat(ds.recs); }); return all.length?all:null; }
  function post(payload, token){

  function salesServer(token, progress){

  var DATA={}, SRC={}, LOADING={};

      p=readIdb('dbpastec_sales','datasets').then(function(v){ var l=flat(v); if(l){ SRC.sales='이 PC의 매출분석도구 자료'; return l; }

  /* ── 묶음 계산: 이상 단가 빼기, 최근 단가·변동 ── */
  function median(a){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){return x-y;}); var m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
  function stats(rows){ // rows: 최근순
    var okRows=rows.filter(function(r){ return r.ok; });
    var med=median(okRows.map(function(r){ return r.price; }));
    var good=okRows.filter(function(r){ return !med || (r.price<=med*10 && r.price>=med/10); });
    var g={ n:rows.length, qty:0, amt:0, last:rows[0], lastP:good[0]||null, prevP:null, min:0, max:0, out:okRows.length-good.length, parties:{} };
    rows.forEach(function(r){ g.qty+=r.qty; g.amt+=r.supply; g.parties[r.party]=1; });
    good.forEach(function(r){ if(!g.min||r.price<g.min) g.min=r.price; if(r.price>g.max) g.max=r.price; });
    if(g.lastP){ // 같은 거래처의 바로 전 다른 단가

  /* ── 표 그리기(정렬 가능, 헤더 고정) ── */

  function foot(src){ var R=DATA[src]; var per=R.length?ymd(R[R.length-1].t)+' ~ '+ymd(R[0].t):''; return '<div class="snote">자료: '+esc(SRC[src])+' · 기간 '+per+' · 단가는 공급가 기준. 수량이 0 이하(반품·정산)이거나 평소 단가의 10배를 넘는 등 이상한 단가는 최저~최고·변동 계산에서 뺍니다. ▲ 오름(빨강) ▼ 내림(파랑)은 같은 거래처의 직전 단가와 비교한 값입니다.</div>'; }

  /* ── 매출 제품의 매입가: 매입 자료(품번별 가장 최근 매입일, 같은 날은 수량가중) 또는 매출분석도구에 공유된 매입가 ── */
  var BUY=null;
  function loadBuy(cur){

  // 제품으로 찾았는데 없을 때: 같은 말이 업체명에 있으면 «업체명으로 검색하기» 버튼

  /* ── 오른쪽 거래 이력: 연도 선택, 제목 정렬, «최저 ~ 최고» 누르면 단가별 목록 ── */
  var HP=null; // {it, year, view:'list'|'price', sk, dir}
  function histPanel(it){

      (gaps.length?'<div class="bp-st">평균 구매주기 <b>'+avgGap+'일</b> · 최단 '+Math.min.apply(null,gaps)+'일 · 최장 '+Math.max.apply(null,gaps)+'일 · 최근 입고 후 <b>'+since+'일</b> 경과 · 다음 예상 <b class="bp-nx">'+bpYmd(nextT)+'</b> · '+(left>=0?left+'일 남음':(-left)+'일 지남')+'</div>':'');
    var T=D.slice().reverse();
    h+='<div class="sbox" style="margin-top:12px"><table style="min-width:900px"><thead><tr><th class="n">순위</th><th>입고일자</th><th>매입처</th><th class="n">매입단가</th><th class="n">이전단가</th><th>인상·인하</th><th class="n">차액</th><th class="n">변동률</th><th class="n">수량</th><th class="n">매입액</th><th class="n">건수</th></tr></thead><tbody>'+
      T.map(function(x,k){ var j=n-1-k, pv=j>0?D[j-1].price:null, df=pv==null?null:x.price-pv, rt=pv?df/pv*100:null;
        var ch=pv==null?'<span class="muted">최초</span>':Math.round(df)>0?'<span class="ar-red">▲ 인상</span>':Math.round(df)<0?'<span class="bp-dn">▼ 인하</span>':'<span class="muted">- 동일</span>';
        var cl=df==null||Math.round(df)===0?'':(df>0?' ar-red':' bp-dn');
        return '<tr><td class="n">'+(k+1)+'</td><td class="d">'+bpYmd(x.t)+'</td><td>'+esc(x.vendor)+'</td><td class="n"><b>'+won(x.price)+'</b></td><td class="n">'+(pv==null?'-':won(pv))+'</td><td>'+ch+'</td>'+
          '<td class="n'+cl+'">'+(df==null?'-':(df>0?'+':'')+won(df))+'</td><td class="n'+cl+'">'+(rt==null?'-':(rt>0?'+':'')+rt.toFixed(1)+'%')+'</td><td class="n">'+num(x.qty)+'</td><td class="n">'+won(x.amt)+'</td><td class="n">'+x.n+'</td></tr>'; }).join('')+
      '</tbody><tfoot><tr><td></td><td>합계</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="n">'+num(tq)+'</td><td class="n">'+won(ta)+'</td><td class="n">'+tn+'</td></tr></tfoot></table></div>';
    box.innerHTML=h;
    S.paint=function(){ var el=$('bpSvg'+i); if(!el) return; var w=el.clientWidth||1000; if(window.innerWidth<=700) w=Math.max(680,w); el.innerHTML=bpChart(D, avg, iMn, iMx, w); };
    S.paint(); bpBind(i);
  }
  function bpBind(i){
    var box=$('bp'+i); if(!box) return;
    box.querySelectorAll('[data-bpy]').forEach(function(b){ b.addEventListener('click', function(){ var v=b.getAttribute('data-bpy'); BP[i].year=v==='all'?'all':+v; bpDraw(i); }); });
  }
  function bpChart(D, avg, iMn, iMx, W){
    var H=330, L=58, R=40, T=30, B=78, iw=W-L-R, ih=H-T-B, n=D.length;
    var ps=D.map(function(x){ return x.price; }), lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps), pad=Math.max((hi-lo)*0.25, hi*0.03, 1);
    var y0=lo-pad, y1=hi+pad, X=function(k){ return n===1 ? L+iw/2 : L+28+(iw-56)*k/(n-1); }, Y=function(v){ return T+ih-(v-y0)/(y1-y0)*ih; };
    var o='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;font-size:12px">';
    for(var k=0;k<=4;k++){ var v=y0+(y1-y0)*k/4, yy=Y(v); o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#23262c"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" fill="#6b7078">'+won(v)+'</text>'; }
    var ya=Y(avg); o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ya+'" y2="'+ya+'" stroke="#34d399" stroke-width="1" stroke-dasharray="5 4" opacity=".7"/><text x="'+(W-R)+'" y="'+(ya+15)+'" text-anchor="end" fill="#6ee7b7">평균 '+won(avg)+'</text>';
    for(var j=1;j<n;j++){ var d=Math.round(D[j].price)-Math.round(D[j-1].price), c=d>0?'#f87171':d<0?'#60a5fa':'#9aa0a8';
      o+='<line x1="'+X(j-1)+'" y1="'+Y(D[j-1].price)+'" x2="'+X(j)+'" y2="'+Y(D[j].price)+'" stroke="'+c+'" stroke-width="2.2"/>'; }
    var by=T+ih+20, cy=H-16;
    D.forEach(function(x,k){ var cx=X(k), py=Y(x.price), big=k===iMx||k===iMn, col=k===iMx&&n>1?'#f87171':'#34d399';
      o+='<circle cx="'+cx+'" cy="'+py+'" r="'+(big?5.5:4)+'" fill="'+(k===iMx&&n>1?'#f87171':'#10b981')+'" stroke="#000" stroke-width="1.5"><title>'+bpYmd(x.t)+' · '+esc(x.vendor)+' · '+won(x.price)+'원 · '+num(x.qty)+'</title></circle>';
      o+='<text x="'+cx+'" y="'+(py-11)+'" text-anchor="middle" fill="'+(k===iMx&&n>1?'#fca5a5':'#e5e7eb')+'" font-weight="600">'+won(x.price)+'</text>';
      if(n>1 && (k===iMx||k===iMn)){ var lb=k===iMx?'최고':'최저', ty=py+(k===iMx?20:20); o+='<rect x="'+(cx-20)+'" y="'+(ty-11)+'" width="40" height="18" rx="9" fill="'+(k===iMx?'#3b1215':'#0c2a22')+'" stroke="'+col+'"/><text x="'+cx+'" y="'+(ty+2)+'" text-anchor="middle" fill="'+col+'" font-size="11" font-weight="700">'+lb+'</text>'; }
      var anchor=n>1&&k===0?'start':n>1&&k===n-1?'end':'middle';
      o+='<text x="'+cx+'" y="'+by+'" text-anchor="'+anchor+'" fill="#9aa0a8">'+bpYmd(x.t,1)+'</text>';
      if(k>0){ var gx=(X(k-1)+cx)/2, gd=bpDays(D[k-1].t,x.t), gc=gd>=60?'#fbbf24':gd<=14?'#60a5fa':'#9aa0a8';
        o+='<line x1="'+gx+'" x2="'+gx+'" y1="'+(T+ih+4)+'" y2="'+(cy-12)+'" stroke="#23262c"/><rect x="'+(gx-22)+'" y="'+(cy-11)+'" width="44" height="18" rx="9" fill="#0d0e10" stroke="'+gc+'88"/><text x="'+gx+'" y="'+(cy+2)+'" text-anchor="middle" fill="'+gc+'" font-size="11">'+gd+'일</text>'; }
    });
    o+='<text x="'+(L-8)+'" y="'+(cy+2)+'" text-anchor="end" fill="#6b7078" font-size="11">구매주기</text>';
    return o+'</svg>';
  }
  var bpRT=0; window.addEventListener('resize', function(){ clearTimeout(bpRT); bpRT=setTimeout(function(){ Object.keys(BP).forEach(function(k){ if(BP[k].paint) BP[k].paint(); }); }, 150); });
  function bpSection(mats){
    BP={};
    var raw=mats.filter(function(m){ return m.kind==='원자재'; }); if(!raw.length) return '';
    return '<div class="bm-sec" style="margin-top:18px">📈 원자재 매입단가 <span class="muted">— 매입분석도구 자료 기준</span></div>'+raw.map(function(m,i){ return bpPanel(m,i); }).join('');
  }
  function bpPaintAll(){ Object.keys(BP).forEach(function(k){ bpDraw(+k); }); }

  /* ── 제품 월별 매출 추이(매출분석도구와 같은 구성) : BOM 품번 ↔ 매출 품번(접미사·앞자리 0 무시), 없으면 품명+규격 ── */
  var SP=null;
  function spRows(code, inf){
    var R=DATA.sales||[], k=bomNk(code), nk=bpN(inf.name)+'|'+bpN(inf.spec), out=[];
    for(var i=0;i<R.length;i++){ var r=R[i]; if(bomNk(r.code)===k) out.push(r); }
    if(!out.length && inf.name){ for(var j=0;j<R.length;j++){ var x=R[j]; if((bpN(x.name)+'|'+bpN(x.spec))===nk) out.push(x); } }
    return out;
  }
  function spSection(code, inf){
    SP=null;
    if(!DATA.sales) return '<div class="snote">매출자료를 읽지 못해 매출 추이를 표시할 수 없습니다.</div>';
    var rows=spRows(code, inf);
    if(!rows.length) return '<div class="bp"><div class="bp-h"><b>📈 '+esc(inf.name||code)+' · 월별 매출 추이</b></div><div class="snote">매출자료에서 이 제품('+esc(code)+')의 출고 기록을 찾지 못했습니다.</div></div>';
    var yrs={}; rows.forEach(function(r){ yrs[r.y]=1; }); var yl=Object.keys(yrs).map(Number).sort(function(a,b){ return b-a; });
    SP={code:code, inf:inf, rows:rows, yl:yl, year:yl[0], m:'amt'};
    return '<div class="bp" id="spBox"></div>';
  }
  function spDraw(){
    var S=SP, box=$('spBox'); if(!S||!box) return;
    var now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1, last=S.year===cy?cm:12;
    var mon=[]; for(var i=0;i<12;i++) mon.push({amt:0, qty:0, n:0});
    var cust={};
    S.rows.forEach(function(r){ if(r.y!==S.year) return; var m=new Date(r.t).getMonth(); mon[m].amt+=r.supply||0; mon[m].qty+=r.qty||0; mon[m].n++; cust[r.party]=(cust[r.party]||0)+(r.supply||0); });
    var key=S.m, vals=mon.map(function(x){ return x[key]; }), tot=vals.reduce(function(a,b){ return a+b; },0), cnt=mon.reduce(function(a,x){ return a+x.n; },0);
    // 평균·최고·최저: 진행 중인 이번 달과 0원 달은 빼고 계산
    var use=[]; for(var k=0;k<last;k++){ if(S.year===cy && k===cm-1) continue; if(vals[k]>0) use.push(k); }
    var avg=use.length?use.reduce(function(a,k){ return a+vals[k]; },0)/use.length:0;
    var iMx=-1, iMn=-1; use.forEach(function(k){ if(iMx<0||vals[k]>vals[iMx]) iMx=k; if(iMn<0||vals[k]<vals[iMn]) iMn=k; });
    var f=key==='amt'?won:num, unit=key==='amt'?'':'';
    var h='<div class="bp-h"><b>📈 '+esc(S.inf.name||S.code)+(S.inf.spec?' <span class="muted" style="font-weight:400">'+esc(S.inf.spec)+'</span>':'')+' / '+S.year+'년 · 월별 매출 추이</b>'+
      S.yl.map(function(y){ return '<button type="button" class="chip sm'+(S.year===y?' on':'')+'" data-spy="'+y+'">'+y+'년</button>'; }).join('')+
      '<span class="co-vw"><button type="button" class="co-vb'+(key==='amt'?' on':'')+'" data-spm="amt">금액</button><button type="button" class="co-vb'+(key==='qty'?' on':'')+'" data-spm="qty">수량</button></span>'+
      '<span class="bp-sub" style="margin-left:auto">합계 <b style="color:var(--text)">'+f(tot)+'</b> · <span style="color:#fbbf24">평균 <b>'+f(Math.round(avg))+'</b>(거래월 '+use.length+'개월)</span>'+
      (iMx>=0?' · <span class="ar-red">최고 <b>'+f(vals[iMx])+'</b>('+(iMx+1)+'월)</span> · <span style="color:#34d399">최저 <b>'+f(vals[iMn])+'</b>('+(iMn+1)+'월)</span>':'')+' · 출고 '+cnt.toLocaleString()+'건</span></div>'+
      '<div class="bp-svg" id="spSvg"></div>'+
      '<div class="bp-st" style="text-align:right">'+(S.year===cy?cm+'월(진행 중)·':'')+'0원 달은 평균·최고·최저에서 제외 · <span style="color:#60a5fa">━ 실적</span> <span style="color:#fbbf24">┅ 평균</span>'+(S.year===cy?' <span class="ar-red">┆ '+cm+'월 현재</span>':'')+'</div>';
    var cl=Object.keys(cust).sort(function(a,b){ return cust[b]-cust[a]; });
    if(cl.length) h+='<div class="bp-st" style="margin-top:8px">'+S.year+'년 출고 업체 '+cl.length+'곳 : '+cl.slice(0,8).map(function(c){ return esc(c)+' <b>'+won(cust[c])+'</b>'; }).join(' · ')+(cl.length>8?' 외 '+(cl.length-8)+'곳':'')+'</div>';
    box.innerHTML=h;
    S.paint=function(){ var el=$('spSvg'); if(!el) return; var w=el.clientWidth||1000; if(window.innerWidth<=700) w=Math.max(680,w); el.innerHTML=spChart(vals, last, avg, iMx, iMn, S.year===cy?cm:0, f, w); };
    S.paint();
    box.querySelectorAll('[data-spy]').forEach(function(b){ b.addEventListener('click', function(){ SP.year=+b.getAttribute('data-spy'); spDraw(); }); });
    box.querySelectorAll('[data-spm]').forEach(function(b){ b.addEventListener('click', function(){ SP.m=b.getAttribute('data-spm'); spDraw(); }); });
  }
  function spChart(vals, last, avg, iMx, iMn, curM, f, W){
    var H=330, L=96, R=150, T=34, B=58, iw=W-L-R, ih=H-T-B;
    var mx=Math.max.apply(null, vals.slice(0,last).concat([avg,1])), top=mx*1.08;
    var X=function(k){ return L+iw*k/11; }, Y=function(v){ return T+ih-(Math.max(0,v)/top)*ih; };
    var o='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;font-size:12px">';
    for(var g=0;g<=4;g++){ var v=top*g/4, yy=Y(v); o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#23262c"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" fill="#6b7078">'+f(Math.round(v))+'</text>'; }
    if(avg>0){ var ya=Y(avg); o+='<line x1="'+L+'" x2="'+(W-R+20)+'" y1="'+ya+'" y2="'+ya+'" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="7 5"/><rect x="'+(W-R+22)+'" y="'+(ya-11)+'" width="'+(R-26)+'" height="22" rx="11" fill="#1f1606" stroke="#f59e0b"/><text x="'+(W-R+22+(R-26)/2)+'" y="'+(ya+4)+'" text-anchor="middle" fill="#fbbf24" font-weight="700" font-size="11.5">평균 '+f(avg)+'</text>'; }
    if(curM){ var xc=X(curM-1); o+='<line x1="'+xc+'" x2="'+xc+'" y1="'+T+'" y2="'+(T+ih)+'" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="'+(xc-38)+'" y="'+(H-22)+'" width="76" height="20" rx="10" fill="#2a0d0f" stroke="#ef4444"/><text x="'+xc+'" y="'+(H-8)+'" text-anchor="middle" fill="#fca5a5" font-weight="700" font-size="11.5">'+curM+'월 현재</text>'; }
    var pts=[]; for(var k=0;k<last;k++) pts.push([X(k),Y(vals[k])]);
    if(pts.length>1) o+='<path d="'+pts.map(function(p,j){ return (j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ')+'" fill="none" stroke="#3b82f6" stroke-width="2.4"/>';
    for(var m=0;m<12;m++){ var x=X(m), sp=m===iMx?'#f87171':m===iMn?'#34d399':(m<last?'#9aa0a8':'#4b5058');
      o+='<text x="'+x+'" y="'+(T+ih+20)+'" text-anchor="middle" fill="'+sp+'"'+(m===iMx||m===iMn?' font-weight="700"':'')+'>'+(m+1)+'월</text>'; }
    for(var q=0;q<last;q++){ var p=pts[q], big=q===iMx||q===iMn, col=q===iMx?'#ef4444':q===iMn?'#14b8a6':'#3b82f6';
      o+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(big?6:4.5)+'" fill="'+col+'" stroke="#000" stroke-width="1.5"><title>'+(q+1)+'월 '+f(vals[q])+'</title></circle>';
      o+='<text x="'+p[0]+'" y="'+(p[1]-11)+'" text-anchor="middle" fill="'+(q===iMx?'#fca5a5':q===iMn?'#5eead4':'#e5e7eb')+'" font-weight="600">'+f(vals[q])+'</text>';
      if(big){ var lb=q===iMx?'최고':'최저'; o+='<rect x="'+(p[0]-21)+'" y="'+(p[1]+10)+'" width="42" height="19" rx="9.5" fill="'+(q===iMx?'#2a0d0f':'#06201d')+'" stroke="'+col+'"/><text x="'+p[0]+'" y="'+(p[1]+23.5)+'" text-anchor="middle" fill="'+(q===iMx?'#fca5a5':'#5eead4')+'" font-size="11" font-weight="700">'+lb+'</text>'; }
    }
    return o+'</svg>';
  }
  window.addEventListener('resize', function(){ setTimeout(function(){ if(SP&&SP.paint&&$('spSvg')) SP.paint(); }, 160); });

  function bomBind(){
    var bk=$('bmBack'); if(bk) bk.addEventListener('click', bomList);
    $('srin').querySelectorAll('tr[data-fr]').forEach(function(tr){ tr.addEventListener('click', function(){ bomRaw(tr.getAttribute('data-fr'), true); $('sr').scrollTop=0; }); });
    $('srin').querySelectorAll('tr[data-fp]').forEach(function(tr){ tr.addEventListener('click', function(){ bomProd(tr.getAttribute('data-fp'), true); $('sr').scrollTop=0; }); });
  }

  /* ── 검색 실행 ── */
  $('sf').addEventListener('submit', function(e){
    e.preventDefault();
    var q=$('sQ').value.trim(), mode=$('sMode').value, M=MODES[mode];
    if(!q){ $('sQ').focus(); return; }
    var H=window.__home;
    (H?H.refreshWho():Promise.resolve(null)).then(function(cur){
      if(!cur){ show(head('로그인이 필요합니다')+'<div class="snote">검색은 매출분석도구 계정으로 로그인한 사람만 쓸 수 있습니다. 오른쪽 위 «로그인»을 눌러 주세요.</div>'); if(H) H.openMem(); return; }
      if(mode==='co') return runCompany(q,cur);
      if(mode==='ar') return runAR(q);
      if(mode==='bom') return runBom(q,cur);
      show(head('검색 중…')+'<div class="snote">자료를 준비하고 있습니다.</div>');
      return ensure(M.src,cur).then(function(R){ return M.src==='sales' ? loadBuy(cur).then(function(){ return R; }, function(){ return R; }) : R; }).then(function(R){
        if(!R.length){ show(head('자료 없음')+'<div class="snote">자료가 비어 있습니다.</div>'); return; }
        VIEW={mode:mode,q:q,year:'',party:'',sortKey:'',dir:-1,items:[],cols:[]};
        rerun();
      });
    }).catch(function(err){ show(head('검색하지 못했습니다')+'<div class="snote" style="color:#f87171">'+esc(err&&err.message||err)+'</div>'); });
  });
})();
