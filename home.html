<style>
  :root{
    --bg:#000; --card:#111214; --card-h:#1a1c20; --line:#2a2d33;
    --text:#f2f3f5; --sub:#9aa0a8; --dim:#6b7078;
    --sales:#3b82f6; --purchase:#10b981; --cost:#a78bfa; --team:#f472b6; --coil:#22d3ee; --price:#fb923c; --material:#f97316; --codematch:#38bdf8; --subul:#a3e635; --new:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
:root{--cw:760px}
  @media (max-width:1160px){ :root{--cw:calc(100vw - 400px)} }
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 16px 32px}
  header{text-align:center;margin-bottom:40px}
  .co{font-size:14px;letter-spacing:.2em;color:var(--sub);margin:0 0 10px}
  h1{font-size:30px;margin:0;font-weight:700}
  .today{margin-top:10px;font-size:14px;color:var(--dim)}
  main{width:var(--cw);max-width:100%;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:stretch;gap:16px}
  a.btn{flex:1 1 auto;display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);
        background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:22px 24px;transition:background .15s,transform .15s}
  a.btn:hover,a.btn:focus-visible{background:var(--card-h);transform:translateY(-2px);outline:none}
  .ico{font-size:30px;line-height:1}
  .name{font-size:21px;font-weight:700}
  .url{font-size:12px;color:var(--dim);margin-top:4px}
  .tx{flex:1 1 auto;min-width:0}
  .arrow{margin-left:4px;font-size:22px;color:var(--c)}
  .upd{flex:0 0 210px;align-self:stretch;border-left:1px solid var(--line);
       padding:2px 0 2px 20px;display:flex;flex-direction:column;justify-content:center}
  .upd .lb{font-size:12px;color:var(--sub)}
  .upd .dt{white-space:nowrap;font-size:14px;font-weight:400;margin-top:4px;font-variant-numeric:tabular-nums}
  .upd .meta{font-size:12px;color:var(--sub);margin-top:4px}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#000;background:var(--new);
         border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
  .err{color:#f87171}
  footer{margin-top:auto;padding-top:40px;font-size:12px;color:var(--dim);text-align:center}
  footer button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;
                padding:5px 12px;cursor:pointer;font:inherit;margin-left:8px}
  footer button:hover{color:var(--text)}
  /* 2026-11-19 사용자 요청: 도구 버튼을 약 50% 작게(→ 같은 날 10% 키움) + 여러 칸으로 배열 (넓은 화면 3칸, 보통 2칸, 휴대폰 1칸) */
  header{margin-bottom:26px}
  main#list{width:min(1300px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
  @media (max-width:1100px){ main#list{grid-template-columns:repeat(2,minmax(0,1fr))} }
  #list .row{display:block}
  #list a.btn{height:100%;flex-wrap:wrap;gap:7px 11px;padding:12px 15px;border-radius:12px}
  #list a.btn:hover{transform:translateY(-1px)}
  #list .ico{font-size:22px}
  #list .name{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #list .url{font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #list .tx{flex:1 1 0}
  #list .arrow{font-size:17.5px}
  #list .upd{order:3;flex:1 1 100%;border-left:none;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;
       align-items:baseline;justify-content:flex-start;gap:2px 9px;padding:7px 0 0}
  #list .upd .lb{font-size:12px}
  #list .upd .dt{font-size:12px;margin-top:0}
  #list .upd .meta{font-size:12px;margin-top:0}
  #list .badge{font-size:11px;padding:0 5px}
  @media (max-width:600px){
    main#list{grid-template-columns:minmax(0,1fr);gap:8px}
    body{padding-top:36px}
    h1{font-size:24px}
    .row{flex-direction:column;gap:0}
    a.btn{border-radius:14px;padding:18px}
    a.btn{flex-wrap:wrap;gap:12px 16px}
    .tx{flex:1 1 0}
    .upd{order:3;flex:1 1 100%;border-left:none;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;
         align-items:baseline;justify-content:flex-start;gap:4px 10px;padding:12px 0 0}
    .upd .dt,.upd .meta{margin-top:0}
  }

  /* 삼선 메뉴 */
  .hb{position:fixed;top:14px;left:14px;z-index:30;width:42px;height:42px;border-radius:10px;
      background:#0d0e10;border:1px solid var(--line);color:var(--text);cursor:pointer;
      display:flex;align-items:center;justify-content:center}
  .hb:hover{background:var(--card-h)}
  .hb svg{width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  .scrim.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:82vw;z-index:50;background:#0d0e10;
          border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s;
          padding:18px 12px;display:flex;flex-direction:column;gap:4px}
  .drawer.on{transform:none}
  .drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px;
              border-bottom:1px solid var(--line);margin-bottom:8px;font-weight:700}
  .drawer .x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
  .mi{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:9px;border:none;
      background:none;color:var(--text);font:inherit;font-size:15px;font-weight:400;cursor:pointer;text-align:left;text-decoration:none}
  .mi:hover{background:var(--card-h)}
  .gh{padding:4px 12px 8px;font-size:12.5px;color:var(--sub)}
  .gh-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .gh-t b{font-size:16px;color:var(--text)}
  .gh-bar{height:12px;border-radius:6px;background:#1c1e22;border:1px solid var(--line);overflow:hidden}
  .gh-bar i{display:block;height:100%;width:0;background:#22c55e;border-radius:6px;transition:width .4s}
  .gh-list{margin-top:9px;display:flex;flex-direction:column;gap:5px}
  .gh-r{display:grid;grid-template-columns:72px 1fr 58px;align-items:center;gap:6px;font-size:11.5px}
  .gh-r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .gh-r .b{height:6px;border-radius:3px;background:#1c1e22;overflow:hidden}
  .gh-r .b i{display:block;height:100%;background:#3b82f6}
  .gh-r .v{text-align:right;font-variant-numeric:tabular-nums}
  .gh-ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--dim)}
  .gh-ft button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:2px 8px;font:inherit;cursor:pointer}
  .gh-ft button:hover{color:var(--text)}
  .msec{font-size:11px;color:var(--dim);padding:4px 12px 4px;letter-spacing:.05em}
  /* Member 창 — 오른쪽에서 밀려 나옴 */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.on{opacity:1;pointer-events:auto}
  .mbox{position:absolute;top:0;right:0;bottom:0;width:520px;max-width:100vw;display:flex;flex-direction:column;
        background:#0d0e10;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease}
  .modal.on .mbox{transform:none}
  /* 우측 상단 로그인 상태 */
  .who{position:fixed;top:14px;right:14px;z-index:30;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 6px;
       border-radius:21px;background:#0d0e10;border:1px solid var(--line);color:var(--text);cursor:pointer;font:inherit;font-size:14px}

  function dayDiff(d){

  }
  function findVer(s){
    var m = /APP_BUILD\s*=\s*['"](v\d+)['"]/.exec(s) || /COIL_VER\s*=\s*['"](v\d+)['"]/.exec(s) || /SM_VER\s*=\s*['"](v\d+)['"]/.exec(s) || /MAT_VER\s*=\s*['"](v\d+)['"]/.exec(s) || /name="su-ver" content="(v\d+)"/.exec(s) || /<title>[^<]*?(v\d+)\s*<\/title>/.exec(s);
    return m ? m[1] : '';
  }

  // ① 기본: 같은 github.io 주소의 배포 파일 머리(Last-Modified = 배포 시각) — 조회 한도 없음
  // v2: 브라우저 저장소(HTTP 캐시)에 아예 쓰지 않고(no-store), 40KB 읽으면 연결을 확실히 끊음(abort).
  //     전에는 6MB 도구 파일을 캐시에 쓰다 만 상태로 남겨, 버튼을 처음 누르면 새 탭이
  //     그 캐시 기록이 끝나기를 기다리며 하얀 화면으로 멈춰 있었음.
  function viaPages(t){
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 15000) : null;
    return fetch(t.src||t.url, {headers:{Range:'bytes=0-40000'}, cache:'no-store', signal: ctl?ctl.signal:undefined}).then(function(r){
      var lm = r.headers.get('Last-Modified');
      return headText(r).then(function(s){
        if(ctl) ctl.abort();
        if(timer) clearTimeout(timer);
        if(!lm) throw new Error('no Last-Modified');
        return { date:new Date(lm).toISOString(), ver:findVer(s) };
      });
    }).catch(function(e){ if(timer) clearTimeout(timer); throw e; });
  }
  // ② 예비: GitHub API(1시간 60회 한도) + raw 파일 머리
  function viaApi(t){
    var api = 'https://api.github.com/repos/'+OWNER+'/'+t.repo+'/commits?path=index.html&per_page=1';
    var raw = 'https://raw.githubusercontent.com/'+OWNER+'/'+t.repo+'/main/index.html';
    var commit = fetch(api, {headers:{Accept:'application/vnd.github+json'}})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(a){
        var c = a && a[0] && a[0].commit; if(!c) throw new Error('no commit');
        var m = /(?:st-)?v\d{2,5}/.exec(c.message||'');
        return { date:(c.committer||c.author).date, verMsg: m ? m[0] : '' };
      });
    var ver = fetch(raw, {headers:{Range:'bytes=0-40000'}, cache:'no-store'})
      .then(headText).then(findVer).catch(function(){ return ''; });
    return Promise.all([commit, ver]).then(function(r){
      return { date:r[0].date, ver: r[1] || r[0].verMsg };
    });
  }
  var ON_PAGES = /\.github\.io$/i.test(location.hostname);
  function fetchTool(t){
    if(!ON_PAGES) return viaApi(t);
    return viaPages(t).then(function(info){
      if(info.ver) return info;
      // 파일 안에 버전이 없는 도구(영업팀 업무분석)는 커밋 메시지에서만 버전 보충
      return viaApi(t).then(function(a){ return { date:info.date, ver:a.ver }; }, function(){ return info; });
    }, function(){ return viaApi(t); });
  }

  function load(force){
    var cache = readCache() || {};
    var fresh = !force && cache.at && (Date.now() - cache.at < CACHE_MS);
    // 새로 추가된 도구(예: 코일)가 지난 확인값에 없으면 바로 다시 확인
    if(fresh && TOOLS.some(function(t){ return !(cache.data && cache.data[t.key]); })) fresh = false;
    if(fresh){
      TOOLS.forEach(function(t){ show(t, cache.data && cache.data[t.key]); });
      $('checked').textContent = fmtTime(new Date(cache.at)) + ' 확인';
      return;
    }
    TOOLS.forEach(function(t){ $('upd-'+t.key).querySelector('.dt').textContent = '확인 중…'; });
    var data = {}, okAll = true;
    Promise.all(TOOLS.map(function(t){
      return fetchTool(t).then(function(info){ data[t.key] = info; show(t, info); })
        .catch(function(){
          okAll = false;
          var old = cache.data && cache.data[t.key];   // 실패하면 지난 확인값이라도 표시
          data[t.key] = old || null;
          show(t, old);
          if(old) $('upd-'+t.key).querySelector('.meta').textContent += ' (지난 확인값)';
        });
    })).then(function(){
      if(okAll){ writeCache({at:Date.now(), data:data}); }
      $('checked').textContent = fmtTime(new Date()) + ' 확인' + (okAll ? '' : ' (일부 실패)');
    });
  }

  $('reload').addEventListener('click', function(){ load(true); });

  // 버튼에 마우스를 올리거나 손가락을 대는 순간 그 도구 파일을 미리 받아 둠 → 눌렀을 때 바로 열림
  var warmed = {};
  function warm(url){
    if(warmed[url]) return; warmed[url] = 1;
    try{ var l=document.createElement('link'); l.rel='prefetch'; l.href=url; l.as='document'; document.head.appendChild(l); }catch(e){}
  }
  document.querySelectorAll('a.btn').forEach(function(a){
    ['pointerenter','touchstart','focus'].forEach(function(ev){
      a.addEventListener(ev, function(){ warm(a.href); }, {passive:true});
    });
  });

  // ── 화면을 켜 둔 동안 새 버전이 배포되면 알림 카드(매출분석도구와 같은 모양) ──
  var known = {};          // 지금 화면에 보이는 도구별 배포 시각·버전
  var pendUpd = {};        // 아직 반영 안 한 새 버전 {key:{info, old}}
  var selfLM = '', selfNew = '', laterUntil = 0, lastChk = Date.now(), chkBusy = false;
  var CHK_MS = 3 * 60 * 1000;
  var _show = show;
  show = function(t, info){
    if(info && info.date){
      known[t.key] = {date:info.date, ver:info.ver||''};
      var p = pendUpd[t.key];   // «새로 확인»으로 이미 화면에 반영됐으면 알림에서 뺌
      if(p && new Date(info.date).getTime() >= new Date(p.info.date).getTime()){ delete pendUpd[t.key]; setTimeout(paintNote, 0); }
    }
    _show(t, info);
  };
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function md(d){ var p=kst(d); return p.m+'/'+p.d+' '+pad(p.h)+':'+pad(p.mi); }
  function selfHead(){
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 15000) : null;
    return fetch(location.href.split('#')[0], {headers:{Range:'bytes=0-1000'}, cache:'no-store', signal: ctl?ctl.signal:undefined})
      .then(function(r){ var lm = r.ok ? (r.headers.get('Last-Modified')||'') : ''; if(ctl) ctl.abort(); if(timer) clearTimeout(timer); return lm; })
      .catch(function(){ if(timer) clearTimeout(timer); return ''; });
  }
  function note(){
    var n = $('updNote');
    if(!n){
      n = document.createElement('div'); n.id = 'updNote'; n.setAttribute('role','alert');
      n.innerHTML = '<div class="u-hd"><div class="u-ic">🔔</div><div><div class="u-ti"></div><div class="u-st"></div></div>'
        + '<button type="button" class="u-x u-later" title="나중에">✕</button></div><div class="u-list"></div>'
        + '<div class="u-ft"><button type="button" class="u-later">나중에</button><button type="button" class="u-go">지금 업데이트</button></div>';
      document.body.appendChild(n);
    }
    return n;
  }
  function paintNote(){
    var keys = Object.keys(pendUpd), n = note();
    var cnt = keys.length + (selfNew ? 1 : 0);
    if(!cnt || Date.now() < laterUntil){ n.style.display = 'none'; return; }
    n.querySelector('.u-ti').textContent = '새 버전이 배포되었습니다 ' + cnt + '건';
    n.querySelector('.u-st').textContent = selfNew ? '«지금 업데이트»를 누르면 홈페이지를 새로 엽니다'
      : '«지금 업데이트»를 누르면 업데이트 일자에 반영됩니다';
    var rows = [];
    if(selfNew) rows.push('<div class="u-row"><span class="u-cat home">홈페이지</span><div class="u-d">업무분석도구 홈페이지 새 버전</div>'
      + '<div class="u-m">' + esc(md(new Date(selfNew))) + ' 배포</div></div>');
    TOOLS.forEach(function(t){
      var u = pendUpd[t.key]; if(!u || t.src) return;   // 단가표 만들기는 매출 분석 도구와 같은 파일 → 알림은 매출 분석 도구 한 줄로
      var v = u.info.ver, ov = u.old && u.old.ver;
      var d = v ? ((ov && ov !== v) ? ov + ' → ' + v : v) + ' 새 버전' : '새 버전';
      rows.push('<div class="u-row"><span class="u-cat ' + t.key + '">' + esc(t.name) + '</span><div class="u-d">' + esc(d) + '</div>'
        + '<div class="u-m">' + esc(md(new Date(u.info.date))) + ' 배포 · 도구를 다시 열면 새 버전이 적용됩니다</div></div>');
    });
    n.querySelector('.u-list').innerHTML = rows.join('');
    n.style.display = 'flex';
  }
  function applyUpd(){
    if(selfNew){ location.reload(); return; }
    var c = readCache() || {}; c.data = c.data || {};
    TOOLS.forEach(function(t){ var u = pendUpd[t.key]; if(u){ show(t, u.info); c.data[t.key] = u.info; } });
    if(c.at) writeCache(c);
    pendUpd = {}; $('checked').textContent = fmtTime(new Date()) + ' 확인'; paintNote();
  }
  function check(){
    if(chkBusy || !ON_PAGES) return;
    chkBusy = true; lastChk = Date.now();
    var jobs = TOOLS.map(function(t){
      return viaPages(t).then(function(info){
        var k = known[t.key];
        if(!k || !info.date || new Date(info.date).getTime() <= new Date(k.date).getTime()) return;
        var p = pendUpd[t.key];
        if(p && p.info.date === info.date) return;
        var full = info.ver ? Promise.resolve(info)
          : viaApi(t).then(function(a){ return {date:info.date, ver:a.ver}; }, function(){ return info; });   // 영업팀: 버전은 커밋 메시지
        return full.then(function(fi){ pendUpd[t.key] = {info:fi, old:k}; });
      }).catch(function(){});
    });
    jobs.push(selfHead().then(function(lm){
      if(!lm) return;
      if(!selfLM){ selfLM = lm; return; }
      if(lm !== selfLM && new Date(lm).getTime() > new Date(selfLM).getTime()) selfNew = lm;
    }));
    Promise.all(jobs).then(function(){ chkBusy = false; paintNote(); });
  }
  document.addEventListener('click', function(e){
    var t = e.target; if(!t || !t.closest) return;
    if(t.closest('#updNote .u-go')){ e.preventDefault(); applyUpd(); }
    else if(t.closest('#updNote .u-later')){ e.preventDefault(); laterUntil = Date.now() + 10*60*1000; paintNote(); setTimeout(paintNote, 10*60*1000 + 500); }
  }, true);
  setInterval(function(){ if(document.visibilityState === 'visible') check(); }, CHK_MS);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && Date.now() - lastChk > 60*1000) check();
  });
  if(ON_PAGES) selfHead().then(function(lm){ if(lm && !selfLM) selfLM = lm; });
  window.__homeUpd = { check:check, state:function(){ return {known:known, pend:pendUpd, selfLM:selfLM, selfNew:selfNew}; } };

  load(false);
})();

<script>

(function(){

  // GitHub 저장 용량: 공개 저장소 목록(size=KB)을 1시간 저장해 두고 사용

  var GH_LIMIT_KB = 1024*1024, GH_KEY = 'dbfHomeGh_v1', GH_MS = 60*60*1000;

  function ghPaint(c, err){

    var tot = c.repos.reduce(function(a,r){ return a + r.kb; }, 0), pct = tot/GH_LIMIT_KB*100;

  function ghLoad(force){

  // 매출분석도구가 이 PC에 저장해 둔 로그인 읽기 (DB가 없으면 만들지 않음)

  function lastLogin(v){

    }else out=str.slice(0,16).replace('T',' ');

    return esc(out)+'<small>'+rel+'</small>';

  function openMem(){

  $('who').addEventListener('click', openMem);
  window.__home = { getCur:function(){ return cur; }, refreshWho:refreshWho, openMem:openMem, call:call };
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshWho(); });
  refreshWho();
})();
</script>
<script>

  (function(){

    m.innerHTML=[].map.call(sel.children,function(c){ return c.tagName==='HR'?'<div class="sep"></div>':'<button type="button" data-v="'+c.value+'">'+esc(c.textContent)+'</button>'; }).join('');

    document.addEventListener('mousedown', function(e){ if(!m.contains(e.target) && e.target!==sel) close(); });
  })();

  /* ── 결과 창 / 오른쪽 이력 창 ── */
  function show(html){ $('srin').innerHTML=html; $('sr').classList.add('on'); }
  function hide(){ $('sr').classList.remove('on'); closeHist(); }
  function head(title,cnt){ return '<div class="srh"><span class="t">'+title+'</span><span class="c">'+(cnt||'')+'</span><button type="button" class="x" id="srX">닫기</button></div>'; }
  document.addEventListener('click', function(e){ if(e.target && e.target.id==='srX') nav(hide,{home:true}); });

  /* ── 브라우저 뒤로가기·앞으로가기 ──

     화면을 옮길 때마다 기록을 남기고, 뒤로·앞으로 가면 그 화면을 그때 상태로 다시 그림.
     같은 화면 안의 정렬·연도·거르기는 기록하지 않음(화면 이동이 아님).

  var NAV={map:{}, cur:'', base:'', n:0};

    if(e.overlay){
      var before = NAV.base===e.parent ? null : navReplay(e.parent);
      return Promise.resolve(before).then(function(){ e.render(); NAV.cur=id; });
    }
    if(NAV.base===id && $('sr').classList.contains('on')){ closeHist(); NAV.cur=id; return; }   // 거래 이력 창만 닫고 그 화면 그대로

  function toDate(d){

      if(d>20000&&d<80000) return new Date(Math.round((d-25569)*86400000)); return new Date(d); }
    var s=String(d||'').trim(); if(!s) return null;
    var m=/^(\d{4})[-./]?(\d{1,2})[-./]?(\d{1,2})/.exec(s); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
    var x=new Date(s); return isNaN(x)?null:x;
  }
  function prep(list, partyKey){
    var out=[];
    for(var i=0;i<list.length;i++){
      var r=list[i]; if(!r) continue; var d=toDate(r.d); if(!d) continue;
      var qty=+r.qty||0, sup=+r.supply||0, pr=+r.price||0; if(!pr && qty) pr=sup/qty;
      var party=String(r[partyKey]||'').trim();
      out.push({t:d.getTime(), y:d.getFullYear(), party:party, code:String(r.code||'').trim(), name:String(r.name||'').trim(), spec:String(r.spec||'').trim(),
        qty:qty, price:pr, supply:sup, ok:(qty>0&&pr>0),
        pk:norm(r.code)+' '+norm(r.name)+' '+norm(r.spec), ck:norm(party)});

    return out;
  }
  function readIdb(dbName, key){

        rq.onerror=function(){ res(null); };
        rq.onsuccess=function(){
          var db=rq.result;
          if(created || !db.objectStoreNames.contains('kv')){ db.close(); return res(null); }
          try{ var g=db.transaction('kv','readonly').objectStore('kv').get(key);
            g.onsuccess=function(){ db.close(); res(g.result==null?null:g.result); };
            g.onerror=function(){ db.close(); res(null); };

        };
      }catch(e){ res(null); }
    });
  }
  function flat(v){ if(!Array.isArray(v)) return null; var all=[]; v.forEach(function(ds){ if(ds&&Array.isArray(ds.recs)) all=all.concat(ds.recs); }); return all.length?all:null; }
  function post(payload, token){

  }
  function decode(enc,data){

    return p.then(function(u){ return JSON.parse(new TextDecoder().decode(u)); });
  }

    return out;
  }
  function salesServer(token, progress){
    return post({action:'dsManifest',fresh:Date.now()},token).then(function(d){
      var months=Object.keys(((d&&d.manifest)||{}).months||{}).sort(); if(!months.length) throw new Error('서버에 공유된 매출자료가 없습니다.');
      var all=[], i=0;
      function next(){ if(i>=months.length) return all; var ym=months[i++]; progress('서버에서 매출자료 받는 중… '+i+'/'+months.length+' ('+ym+')');
        return post({action:'dsGet',ym:ym},token).then(function(g){ if(!g||!g.data) return next(); return decode(g.enc||'gz',g.data).then(function(pk){ all=all.concat(unpack(pk)); return next(); }); }); }
      return next();
    });
  }
  var DATA={}, SRC={}, LOADING={};
  function ensure(src, cur){
    if(DATA[src]) return Promise.resolve(DATA[src]);
    if(LOADING[src]) return LOADING[src];
    var p;
    if(src==='sales'){
      p=readIdb('dbpastec_sales','datasets').then(function(v){ var l=flat(v); if(l){ SRC.sales='이 PC의 매출분석도구 자료'; return l; }
        SRC.sales='매출분석 서버 공유자료'; return salesServer(cur.token,function(m){ show(head('자료 준비 중')+'<div class="snote">'+esc(m)+'</div>'); }); })
        .then(function(l){ return prep(l,'cust'); });
    }else{
      p=readIdb('dbpastec_purchase','datasets').then(function(v){ var l=flat(v);
        if(!l) throw new Error('이 PC에 매입 자료가 없습니다. 매입분석도구를 한 번 열어 자료를 받은 뒤 다시 검색해 주세요.');
        SRC.purch='이 PC의 매입분석도구 자료'; return prep(l,'vendor'); });
    }
    LOADING[src]=p.then(function(rows){ DATA[src]=rows; LOADING[src]=null; return rows; }, function(e){ LOADING[src]=null; throw e; });
    return LOADING[src];
  }

  /* ── 묶음 계산: 이상 단가 빼기, 최근 단가·변동 ── */
  function median(a){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){return x-y;}); var m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
  function stats(rows){ // rows: 최근순
    var okRows=rows.filter(function(r){ return r.ok; });
    var med=median(okRows.map(function(r){ return r.price; }));
    var good=okRows.filter(function(r){ return !med || (r.price<=med*10 && r.price>=med/10); });
    var g={ n:rows.length, qty:0, amt:0, last:rows[0], lastP:good[0]||null, prevP:null, min:0, max:0, out:okRows.length-good.length, parties:{} };
    rows.forEach(function(r){ g.qty+=r.qty; g.amt+=r.supply; g.parties[r.party]=1; });
    good.forEach(function(r){ if(!g.min||r.price<g.min) g.min=r.price; if(r.price>g.max) g.max=r.price; });
    if(g.lastP){ // 같은 거래처의 바로 전 다른 단가
      for(var i=1;i<good.length;i++){ var r=good[i]; if(r.party===g.lastP.party && Math.abs(r.price-g.lastP.price)>=0.5){ g.prevP=r; break; } }
    }
    g.chg = g.prevP ? (g.lastP.price-g.prevP.price)/g.prevP.price*100 : 0;
    g.np = Object.keys(g.parties).length;
    return g;
  }
  function chgHtml(g){
    if(!g.prevP) return '<span class="muted">—</span>';
    var up=g.chg>0, cls=up?'up':'dn';
    return '<span class="chg '+cls+'" title="'+esc(ymd(g.prevP.t)+' '+won(g.prevP.price)+'원 → '+ymd(g.lastP.t)+' '+won(g.lastP.price)+'원')+'">'+(up?'▲':'▼')+' '+Math.abs(g.chg).toFixed(1)+'%</span>';
  }

  /* ── 표 그리기(정렬 가능, 헤더 고정) ── */
  var VIEW=null; // {mode,q,year,party,items,cols,sortKey,dir}
  function yearChips(rows, year, attr){
    var ys={}; rows.forEach(function(r){ ys[r.y]=1; }); var list=Object.keys(ys).sort().reverse();
    return '<div class="chips"><span class="cl">연도</span><button type="button" class="chip'+(year?'':' on')+'" data-'+attr+'="">전체</button>'+list.map(function(y){ return '<button type="button" class="chip'+(+year===+y?' on':'')+'" data-'+attr+'="'+y+'">'+y+'년</button>'; }).join('')+'</div>';
  }
  function sortItems(){
    var k=VIEW.sortKey, dir=VIEW.dir;
    VIEW.items.sort(function(a,b){ var x=a.s[k], y=b.s[k]; if(typeof x==='string'||typeof y==='string') return String(x||'').localeCompare(String(y||''),'ko')*dir; return ((x||0)-(y||0))*dir; });
  }
  function tableHtml(){
    var th=VIEW.cols.map(function(c){ var on=VIEW.sortKey===c.k; return '<th class="'+(c.n&&!c.dt?'n ':'')+'srt'+(on?' on':'')+'" data-k="'+c.k+'">'+c.h+'<i>'+(on?(VIEW.dir>0?'▲':'▼'):'')+'</i></th>'; }).join('');
    var LIM=VIEW.limit||500, tr=VIEW.items.slice(0,LIM).map(function(it,i){ return '<tr class="pick" data-i="'+i+'">'+it.cells+'</tr>'; }).join('');
    return '<div class="sbox"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div>'+(VIEW.items.length>LIM?'<div class="snote">표에는 '+LIM.toLocaleString()+'줄까지만 표시합니다. 연도·월이나 검색어로 좁혀 주세요.</div>':'');
  }
  function bindTable(){
    $('srin').querySelectorAll('th.srt').forEach(function(th){ th.addEventListener('click', function(){
      var k=th.getAttribute('data-k'); if(VIEW.sortKey===k) VIEW.dir=-VIEW.dir; else { VIEW.sortKey=k; VIEW.dir=(VIEW.cols.filter(function(c){return c.k===k;})[0]||{}).n?-1:1; }
      sortItems(); $('srTbl').innerHTML=tableHtml(); bindTable(); }); });
    $('srin').querySelectorAll('tr.pick').forEach(function(tr){ tr.addEventListener('click', function(){ var it=VIEW.items[+tr.getAttribute('data-i')]; if(it) nav(function(){ histPanel(it); },{overlay:true}); }); });
  }
  function foot(src){ var R=DATA[src]; var per=R.length?ymd(R[R.length-1].t)+' ~ '+ymd(R[0].t):''; return '<div class="snote">자료: '+esc(SRC[src])+' · 기간 '+per+' · 단가는 공급가 기준. 수량이 0 이하(반품·정산)이거나 평소 단가의 10배를 넘는 등 이상한 단가는 최저~최고·변동 계산에서 뺍니다. ▲ 오름(빨강) ▼ 내림(파랑)은 같은 거래처의 직전 단가와 비교한 값입니다.</div>'; }

  function groupBy(rows, keyFn){ var m={}, keys=[]; rows.forEach(function(r){ var k=keyFn(r); if(!m[k]){ m[k]=[]; keys.push(k); } m[k].push(r); }); return keys.map(function(k){ return {k:k, rows:m[k]}; }); }
  function terms(q){ return String(q).toLowerCase().split(/\s+/).filter(Boolean).map(norm); }
  function hitAll(key, ts){ for(var i=0;i<ts.length;i++) if(key.indexOf(ts[i])<0) return false; return true; }

  /* ── 매출 제품의 매입가: 매입 자료(품번별 가장 최근 매입일, 같은 날은 수량가중) 또는 매출분석도구에 공유된 매입가 ── */
  var BUY=null;
  function loadBuy(cur){
    if(BUY) return Promise.resolve(BUY);
    return Promise.all([readIdb('dbpastec_sales','settings'), ensure('purch',cur).catch(function(){ return []; })]).then(function(a){
      var m={}, pb=(a[0]&&a[0].prodBuyPrice)||{};
      Object.keys(pb).forEach(function(k){ var o=pb[k]; if(k==='_meta'||!o||!(o.p>0)) return; var d=toDate(o.d); m[String(k).trim()]={p:+o.p, t:d?d.getTime():0, v:o.v||''}; });
      var best={}; (a[1]||[]).forEach(function(r){ if(!r.code||!(r.qty>0)) return; var u=r.supply>0?r.supply/r.qty:r.price; if(!(u>0)) return;
        var o=best[r.code]; if(!o||r.t>o.t) best[r.code]={t:r.t,sum:u*r.qty,qty:r.qty,v:r.party}; else if(r.t===o.t){ o.sum+=u*r.qty; o.qty+=r.qty; } });
      Object.keys(best).forEach(function(k){ var o=best[k], x=m[k]; if(!x||o.t>=x.t) m[k]={p:Math.round(o.sum/o.qty), t:o.t, v:o.v}; });
      BUY=m; return m;
    });
  }
  function addBuy(on){ // 표에 «매입가» 열을 «최근 단가» 왼쪽에 끼움
    if(!on || !BUY || !VIEW || VIEW.kind==='tx') return;
    var at=-1; VIEW.cols.forEach(function(c,i){ if(c.k==='price') at=i; }); if(at<0) return;
    if(!VIEW.cols.some(function(c){ return c.k==='buy'; })) VIEW.cols.splice(at,0,{k:'buy',h:'매입가',n:1});
    VIEW.items.forEach(function(it){ var b=BUY[String(it.s.code||'').trim()]; it.s.buy=b?b.p:0;
      var sp=it.s.price, mg=(b&&sp)?((sp-b.p)/sp*100):null;
      var td=b?'<td class="n buy" title="'+esc((b.v||'')+(b.t?' · '+ymd(b.t):'')+(mg!=null?' · 마진 '+mg.toFixed(1)+'%':''))+'">'+won(b.p)+'</td>':'<td class="n buy"><span class="muted">—</span></td>';
      var pos=-1; for(var i=0;i<at;i++){ pos=it.cells.indexOf('</td>',pos+1); if(pos<0) break; }
      if(pos>=0) it.cells=it.cells.slice(0,pos+5)+td+it.cells.slice(pos+5); });
  }

  // ① 제품 단가
  // 검색어 안에 업체명과 제품명이 섞여 있으면 나눔(순서 상관없음): 제품 쪽에만 있는 말 → 제품, 업체 쪽에만 있는 말 → 업체
  function splitTerms(R, ts, partyFirst){
    var P=[], C=[];
    ts.forEach(function(t){
      var inP=false, inC=false;
      for(var i=0;i<R.length && !(inP&&inC);i++){ var r=R[i]; if(!inP && r.pk.indexOf(t)>=0) inP=true; if(!inC && r.ck.indexOf(t)>=0) inC=true; }
      if(inP && inC) (partyFirst?C:P).push(t); else if(inC) C.push(t); else P.push(t);
    });
    return {p:P, c:C};
  }
  function runProd(){
    var M=MODES[VIEW.mode], R=DATA[M.src], ts=terms(VIEW.q), sp=splitTerms(R,ts,false);
    if(!sp.p.length) sp={p:ts, c:[]};
    var hits=R.filter(function(r){ return hitAll(r.pk,sp.p) && (!sp.c.length || hitAll(r.ck,sp.c)); });
    var rows=VIEW.year ? hits.filter(function(r){ return r.y===+VIEW.year; }) : hits;
    VIEW.cols=[{k:'code',h:'품번'},{k:'name',h:'품명'},{k:'spec',h:'규격'},{k:'price',h:'최근 단가',n:1},{k:'chg',h:'변동',n:1},{k:'date',h:'최근 거래',n:1,dt:1},{k:'party',h:'최근 '+M.party},{k:'min',h:'최저',n:1},{k:'max',h:'최고',n:1},{k:'np',h:M.party+' 수',n:1},{k:'n',h:'건수',n:1}];
    VIEW.items=groupBy(rows,function(r){ return r.code+'|'+r.name+'|'+r.spec; }).map(function(G){
      var g=stats(G.rows), L=g.lastP||g.last, f=G.rows[0];
      return {rows:G.rows, g:g, label:f.code+' '+f.name+' '+f.spec, s:{code:f.code,name:f.name,spec:f.spec,price:g.lastP?g.lastP.price:0,chg:g.chg,date:g.last.t,party:L.party,min:g.min,max:g.max,np:g.np,n:g.n},
        cells:'<td class="code">'+esc(f.code)+'</td><td class="nm">'+esc(f.name)+'</td><td class="nm">'+esc(f.spec)+'</td><td class="n"><b>'+(g.lastP?won(g.lastP.price):'—')+'</b></td><td class="n">'+chgHtml(g)+'</td><td class="d">'+ymd(g.last.t)+'</td><td class="nm">'+esc(L.party)+'</td><td class="n">'+(g.min?won(g.min):'—')+'</td><td class="n">'+(g.max?won(g.max):'—')+'</td><td class="n">'+g.np+'</td><td class="n">'+g.n+'</td>'};
    });
    addBuy(M.src==='sales');
    if(!VIEW.sortKey){ VIEW.sortKey='date'; VIEW.dir=-1; } sortItems();
    show(head(M.title+' · '+esc(VIEW.q), VIEW.items.length+'개 제품')+(hits.length?yearChips(hits,VIEW.year,'y'):'')+
      (VIEW.items.length?'<div id="srTbl">'+tableHtml()+'</div><div class="snote">제품 줄을 누르면 오른쪽에 거래 이력이 나옵니다. 제목을 누르면 정렬됩니다.</div>':noProdHtml(M,R,ts))+foot(M.src));
    bindAfter();
  }
  // ② 업체별 단가
  function runParty(){
    var M=MODES[VIEW.mode], R=DATA[M.src], ts=terms(VIEW.q), cm={}, sp=splitTerms(R,ts,true);

    R.forEach(function(r){ if(r.party && hitAll(r.ck,sp.c) && (!sp.p.length || hitAll(r.pk,sp.p))){ (cm[r.party]=cm[r.party]||{amt:0}).amt+=r.supply; } });
    var parties=Object.keys(cm).sort(function(a,b){ return cm[b].amt-cm[a].amt; });
    if(!parties.length){
      var pn=0; for(var i=0;i<R.length;i++){ if(hitAll(R[i].pk,ts)){ pn=1; break; } }
      show(head(M.title+' · '+esc(VIEW.q))+'<div class="snote">찾는 '+M.party+'가 없습니다. 이름 일부만 넣어 보세요.</div>'+
        (pn?'<div class="swbox"><span>«'+esc(VIEW.q)+'» 이름의 제품이 있습니다.</span><button type="button" class="swbtn" data-sw="'+(M.src==='sales'?'sp':'pp')+'">제품으로 검색하기 →</button></div>':'')+foot(M.src));
      bindSwitch(); return; }
    if(!VIEW.party || !cm[VIEW.party]) VIEW.party=parties[0];
    var mine=R.filter(function(r){ return r.party===VIEW.party && (!sp.p.length || hitAll(r.pk,sp.p)); });
    var rows=VIEW.year ? mine.filter(function(r){ return r.y===+VIEW.year; }) : mine;
    VIEW.cols=[{k:'code',h:'품번'},{k:'name',h:'품명'},{k:'spec',h:'규격'},{k:'price',h:'최근 단가',n:1},{k:'chg',h:'변동',n:1},{k:'date',h:'최근 거래일',n:1,dt:1},{k:'min',h:'최저',n:1},{k:'max',h:'최고',n:1},{k:'qty',h:'수량 합계',n:1},{k:'amt',h:'공급가 합계',n:1},{k:'n',h:'건수',n:1}];
    var tot=0;
    VIEW.items=groupBy(rows,function(r){ return r.code+'|'+r.name+'|'+r.spec; }).map(function(G){
      var g=stats(G.rows), f=G.rows[0]; tot+=g.amt;
      return {rows:G.rows, g:g, party:VIEW.party, label:f.code+' '+f.name+' '+f.spec, s:{code:f.code,name:f.name,spec:f.spec,price:g.lastP?g.lastP.price:0,chg:g.chg,date:g.last.t,min:g.min,max:g.max,qty:g.qty,amt:g.amt,n:g.n},
        cells:'<td class="code">'+esc(f.code)+'</td><td class="nm">'+esc(f.name)+'</td><td class="nm">'+esc(f.spec)+'</td><td class="n"><b>'+(g.lastP?won(g.lastP.price):'—')+'</b></td><td class="n">'+chgHtml(g)+'</td><td class="d">'+ymd(g.last.t)+'</td><td class="n">'+(g.min?won(g.min):'—')+'</td><td class="n">'+(g.max?won(g.max):'—')+'</td><td class="n">'+num(g.qty)+'</td><td class="n">'+won(g.amt)+'</td><td class="n">'+g.n+'</td>'};
    });

    show(head(M.title+' · '+esc(VIEW.party), VIEW.items.length+'개 제품 · 공급가 '+won(tot)+'원')+chips+yearChips(mine,VIEW.year,'y')+
      '<div id="srTbl">'+tableHtml()+'</div><div class="snote">제품 줄을 누르면 오른쪽에 이 '+M.party+'와의 거래 이력이 나옵니다. 제목을 누르면 정렬됩니다.</div>'+foot(M.src));
    bindAfter();
  }
  // 제품으로 찾았는데 없을 때: 같은 말이 업체명에 있으면 «업체명으로 검색하기» 버튼
  function noProdHtml(M,R,ts){
    var pm={}; R.forEach(function(r){ if(r.party && hitAll(r.ck,ts)) pm[r.party]=1; });
    var ps=Object.keys(pm), base='<div class="snote">찾는 제품이 없습니다. 품번·품명·규격 일부만 넣어 보세요.</div>';
    if(!ps.length) return base;
    return base+'<div class="swbox"><span>«'+esc(VIEW.q)+'» 이름의 '+M.party+'가 '+ps.length+'곳 있습니다'+(ps.length<=3?' ('+ps.map(esc).join(', ')+')':'')+'.</span>'+
      '<button type="button" class="swbtn" data-sw="'+(M.src==='sales'?'sc':'pc')+'">'+M.party+'명으로 검색하기 →</button></div>';
  }
  function bindSwitch(){
    $('srin').querySelectorAll('.swbtn[data-sw]').forEach(function(b){ b.addEventListener('click', function(){
      var sel=$('sMode'); sel.value=b.getAttribute('data-sw'); sel.dispatchEvent(new Event('change',{bubbles:true}));

  }
  function bindAfter(){

    $('srin').querySelectorAll('.chip[data-y]').forEach(function(b){ b.addEventListener('click', function(){ VIEW.year=b.getAttribute('data-y'); rerun(); }); });
    $('srin').querySelectorAll('.chip[data-p]').forEach(function(b){ b.addEventListener('click', function(){ VIEW.party=b.getAttribute('data-p'); rerun(); }); });
  }
  function rerun(){ closeHist(); if(MODES[VIEW.mode].kind==='prod') runProd(); else runParty(); }

  /* ── 오른쪽 거래 이력: 연도 선택, 제목 정렬, «최저 ~ 최고» 누르면 단가별 목록 ── */
  var HP=null; // {it, year, view:'list'|'price', sk, dir}
  function histPanel(it){
    var rows=it.rows;
    // 같은 거래처의 직전 단가와 비교(전체 기간 기준으로 미리 계산)
    var prevBy={}, med=median(rows.filter(function(r){ return r.ok; }).map(function(r){ return r.price; }));
    rows.forEach(function(r){ r._bad = !r.ok || (med && (r.price>med*10 || r.price<med/10)); });
    for(var i=rows.length-1;i>=0;i--){ var r=rows[i]; r._chg=null; if(r._bad) continue;
      var pv=prevBy[r.party]; if(pv!=null && Math.abs(r.price-pv)>=0.5){ r._chg=(r.price-pv)/pv*100; r._prev=pv; }
      prevBy[r.party]=r.price; }
    HP={it:it, year:VIEW.year||'', view:'list', sk:'t', dir:-1};
    setPF(''); $('hpQw').style.display = MODES[VIEW.mode].kind==='prod' ? '' : 'none';
    drawHist(); $('hp').classList.add('on'); $('hpBody').scrollTop=0;
  }
  function hpSortTh(cols){
    return cols.map(function(c){ var on=HP.sk===c.k; return '<th class="'+(c.n?'n ':'')+'hsrt'+(on?' on':'')+'" data-k="'+c.k+'">'+c.h+'<i>'+(on?(HP.dir>0?'▲':'▼'):'')+'</i></th>'; }).join('');
  }
  function cmp(k,dir){ return function(a,b){ var x=a[k], y=b[k]; if(typeof x==='string'||typeof y==='string') return String(x||'').localeCompare(String(y||''),'ko')*dir; return ((x==null?-1e18:x)-(y==null?-1e18:y))*dir; }; }
  function drawHist(){
    var M=MODES[VIEW.mode], it=HP.it, all=it.rows;
    var rows=HP.year ? all.filter(function(r){ return r.y===+HP.year; }) : all;
    var pfAll=null;
    if(HP.pf){ var pq=pnorm(HP.pf); var pfn=function(r){ return HP.pfx ? r.party===HP.pf : pnorm(r.party).indexOf(pq)>=0; };
      rows=rows.filter(pfn); pfAll=all.filter(pfn); }

  function partyAgg(rows){ // 업체별 합계·연도별 합계·최근 거래
    var m={}; rows.forEach(function(r){ if(!r.party) return; var a=m[r.party]||(m[r.party]={amt:0,last:0,n:0,y:{}}); a.amt+=r.supply; a.n++; a.y[r.y]=(a.y[r.y]||0)+r.supply; if(r.t>a.last) a.last=r.t; });

  function coIndex(){

  /* 검색어 숫자는 «숫자 단위»로 맞춤: 61 이 1.6x161·MCEGIC16136 안의 61 에 걸리지 않게 */

  function bomProd(code, back){

      bomKids(cd).forEach(function(c){
        if(guard++>4000) return;
        var cc=String(c.code||''), ci=bomInfo(cc), kind=c.kind||ci.kind;

          f.via.push(path.length?path[path.length-1]:'(직접)');

      });
    }

    h+=fl.length?'<div class="sbox" style="margin-bottom:16px"><table class="gs" style="min-width:700px"><thead><tr><th>구분</th><th>자재 품번</th><th>품명</th><th>규격</th><th>단위</th><th>들어가는 곳</th></tr></thead><tbody>'+

    S.past.forEach(function(v,i){ if((S.noMonth?0:(ci-i)%3)||i===ci)return;
      g+='<circle cx="'+X(i)+'" cy="'+Yv(v)+'" r="2.8" fill="#000" stroke="'+cl+'" stroke-width="1.8"/><text x="'+X(i)+'" y="'+(Yv(v)-9)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+cl+'">'+fm(v)+'</text>'; });
    if(nf)g+='<polyline points="'+c0+' '+S.fut.map(function(v,i){ return X(np+i)+','+Yv(v); }).join(' ')+'" fill="none" stroke="'+cl+'" stroke-width="2.6" stroke-dasharray="7 5" stroke-linejoin="round"/>';
    g+='<line x1="'+X(ci)+'" x2="'+X(ci)+'" y1="'+P.t+'" y2="'+(P.t+ph)+'" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>'+
       '<circle cx="'+X(ci)+'" cy="'+Yv(S.cur)+'" r="5" fill="#000" stroke="'+cl+'" stroke-width="3"/>'+
       '<text x="'+X(ci)+'" y="'+(Yv(S.cur)-12)+'" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">'+fm(S.cur)+'</text>'+
       '<text x="'+X(ci)+'" y="'+(P.t-8)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#f59e0b">현재</text>';
    [3,6,nf].forEach(function(mo){ if(!mo||mo>nf)return; var i=ci+mo, v=S.fut[mo-1];
      g+='<circle cx="'+X(i)+'" cy="'+Yv(v)+'" r="3.6" fill="#000" stroke="'+cl+'" stroke-width="2"/><text x="'+X(i)+'" y="'+(Yv(v)-10)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+cl+'">'+fm(v)+'</text>'; });
    if(!S.noMonth)labs.forEach(function(L,i){ if((i-ci)%3&&i!==ci)return;
      g+='<text x="'+X(i)+'" y="'+(P.t+ph+18)+'" text-anchor="middle" font-size="12" fill="'+(i===ci?'#f59e0b':'#6b7078')+'" font-weight="'+(i===ci?800:400)+'">'+String(L.y).slice(2)+'.'+String(L.m).padStart(2,'0')+'</text>'; });
    g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+(P.t+ph)+'" y2="'+(P.t+ph)+'" stroke="#2a2d33"/>';
    return '<div class="stt" id="sttBox"><div class="stt-h"><b style="color:'+cl+'">'+E(S.name)+(S.noMonth?' · 관련 원료 흐름':' 월별 추이')+'</b><span>'+S.sub+'</span>'+
      '<button type="button" data-stx="1">✕ 닫기</button></div>'+(S.note?'<div class="stt-n">'+S.note+'</div>':'')+
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="font-family:inherit">'+g+'</svg>'+
      '<div class="stt-m">'+S.memo+'</div></div>';
  }
  function steelCard(r){ var c=r[1]||'#64748b';
    return '<button type="button" class="stc'+(KEY===r[0]?' on':'')+'" data-stk="'+E(r[0])+'" style="--c:'+E(c)+';--cl:'+light(E(c))+'" title="'+E(r[0])+' 월별 추이 보기 · 다시 누르면 닫힘">'+
      '<div class="stc-t"><span class="stc-n">'+E(r[0])+'</span>'+chip(r[3])+'</div>'+
      '<div class="stc-v">'+E(r[2])+'</div>'+
      '<div class="stc-s">'+E(r[4])+'<b>'+E(r[5])+'</b></div>'+
      '<div class="stc-k">'+E(r[6])+'<b>'+E(r[7])+'</b></div>'+dir(r[8])+spark(r[9],c)+'</button>'; }
  function scrapCard(r){ var c=r[1]||'#ea580c', cur=num(r[2])||0, prev=num(r[3])||0, pct=prev?(cur-prev)/prev*100:0, sp=nums(r[9]);
    var foot=sp.length>=2?'<div class="sc-sl"><span>기준 25.02 <b>'+fm(sp[0])+'</b></span><span class="rg">최저 '+fm(Math.min.apply(null,sp))+' · 최고 '+fm(Math.max.apply(null,sp))+'</span>'+
      '<span>현재 '+E(r[8]||'')+' <b style="color:'+light(c)+'">'+fm(sp[sp.length-1])+'</b></span></div>':'';
    return '<button type="button" class="stc sc'+(KEY===SCK?' on':'')+'" data-stk="'+E(SCK)+'" style="--c:'+E(c)+';--cl:'+light(E(c))+'" title="고철(생철A) 월별 추이 보기 · 다시 누르면 닫힘">'+
      '<div class="stc-t"><span class="stc-n">'+E(SCK)+'</span>'+chip(pct.toFixed(1))+'</div>'+
      '<div class="sc-v">'+E(r[2])+'<span>원/kg</span></div>'+
      '<div class="sc-hi"><span class="l">최고</span><b>'+E(r[5]||'')+'</b><span class="s">'+E(r[6]||'')+'</span></div>'+
      '<div class="stc-s">'+E(r[4]||'')+' · = '+(cur*1000).toLocaleString('ko-KR')+'원/톤<span class="sc-ud">'+E(r[8]||'')+'</span></div>'+
      dir(r[7])+spark(r[9],c,true)+foot+'</button>'; }
  /* v3(11.21): STS430·STS201 — stCard 에 행이 있으면 그 값, 없으면 stPrice(미확인)+관련 원료(페로크롬·니켈) 흐름으로 임시 카드 */
  var XTRA=[{n:'STS430',c:'#0d9488',raw:'페로크롬'},{n:'STS201',c:'#c026d3',raw:'니켈'}];
  function rawRow(k){ var r=null; rows('stRawCard').forEach(function(x){ if(!r&&String(x[0]).indexOf(k)===0)r=x; }); return r; }
  function priceRow(k){ var r=null; rows('stPrice').forEach(function(x){ if(!r&&x[0]===k)r=x; }); return r; }
  function naCard(x){ var pr=priceRow(x.n), rw=rawRow(x.raw), v=pr&&num(pr[2])!=null?pr[2]:'', d=pr?pr[5]:'보합';
    return '<button type="button" class="stc'+(KEY===x.n?' on':'')+'" data-stk="'+E(x.n)+'" style="--c:'+x.c+';--cl:'+light(x.c)+'" title="'+E(x.n)+' 공개 유통가 미확인 · 누르면 관련 원료('+E(x.raw)+') 흐름">'+
      '<div class="stc-t"><span class="stc-n">'+E(x.n)+'</span>'+'</div>'+
      (v?'<div class="stc-v">'+E(v)+'</div>':'<div class="stc-v na">시세 미확인</div>')+
      '<div class="stc-s">유통가<b>'+E(pr&&pr[6]&&pr[6]!=='-'?pr[6]:'공개 시세 없음')+'</b></div>'+
      '<div class="stc-s">'+(rw?E(x.raw)+'<b>'+E(rw[2])+' '+E(rw[1])+'</b>':'')+'</div>'+
      dir(d)+(rw?spark(rw[7],x.c):'')+'</button>'; }
  function seriesNa(x){ var rw=rawRow(x.raw); if(!rw)return null; var v=nums(rw[7]); if(v.length<2)return null; var pr=priceRow(x.n);
    return {name:x.n,color:x.c,past:v,fut:[],lo:[],hi:[],cur:v[v.length-1],noMonth:true,
      note:E(x.n)+' 국내 유통가는 공개 시세가 없어 미확인'+(pr?(' · 전망 '+E(pr[3])+'/'+E(pr[4])+' · '+E(pr[7]||'')):''),
      sub:'관련 원료 '+E(x.raw)+' 최근 '+v.length+'개 시점 · 단위 '+E(rw[1])+' (기준일 '+E(rw[6]||'')+')',
      memo:'※ 매출분석도구 시장자료에 '+E(x.n)+' 유통가가 들어오면 이 카드도 유통가·월별 추이로 바뀜'}; }
  function ymd(v){ var m=String(v||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m?(m[1]+'.'+m[2].padStart(2,'0')+'.'+m[3].padStart(2,'0')):String(v||'-'); }
  function paint(){
    var R=rows('stCard'), box=document.getElementById('stl'); if(!box)return;
    if(!R.length){ box.hidden=true; return; }
    box.hidden=false;
    document.getElementById('stlSub').textContent='유통가 천원/톤 · 카드 누르면 추이';
    document.getElementById('stlUpd').innerHTML='🕒 업데이트<b>'+E(ymd(D.asOf||D.stAsOf))+'</b>';
    /* 순서: 강판(후판 제외) → STS304 오른쪽에 STS430·STS201 → 맨 오른쪽 고철(생철A) */
    var sc=scRow(), h=[], have={};
    R.forEach(function(r){ have[r[0]]=1; });
    function extras(){ XTRA.forEach(function(x){ if(have[x.n]){ R.forEach(function(r){ if(r[0]===x.n)h.push(steelCard(r)); }); } else h.push(naCard(x)); }); }
    var done=false;
    R.forEach(function(r){
      if(r[0]==='후판')return;
      if(/생철/.test(r[0])&&sc)return;
      if(XTRA.some(function(x){ return x.n===r[0]; }))return;
      h.push(steelCard(r));
      if(r[0]==='STS304'){ extras(); done=true; } });
    if(!done)extras();
    if(sc)h.push(scrapCard(sc));
    document.getElementById('stlG').innerHTML=h.join('');
    document.getElementById('stlT').innerHTML=trend();
  }
  function use(u,tag,asOf){ if(!u||!u.stCard)return false;
    D={tag:tag||'',asOf:asOf||u.asOf||'',stAsOf:u.stAsOf||'',stCard:u.stCard,stFcast:u.stFcast||'',stScCard:u.stScCard||'',stScSp1F:u.stScSp1F||'',stPrice:u.stPrice||'',stRawCard:u.stRawCard||''}; return true; }
  var saved=null; try{ saved=JSON.parse(localStorage.getItem(LS)||'null'); }catch(_e){}
  if(!(saved&&saved.tag>=EMB.tag&&use(saved,saved.tag,saved.asOf)))use(EMB,EMB.tag,EMB.asOf);
  paint();
  function load(){
    if(!window.fetch)return;
    fetch(URL+'?t='+Math.floor(Date.now()/36e5),{cache:'no-cache'}).then(function(r){ if(!r.ok)throw 0; return r.json(); }).then(function(j){
      if(!j||!j.update||!j.update.stCard||!(String(j.tag||'')>=String(D&&D.tag||'')))return;
      if(use(j.update,String(j.tag||''),j.asOf||j.update.asOf)){ try{ localStorage.setItem(LS,JSON.stringify(D)); }catch(_s){} paint(); }
    }).catch(function(){});
  }
  load(); setInterval(load,3*36e5);
  document.addEventListener('click',function(ev){
    var t=ev.target&&ev.target.closest; if(!t)return;
    var x=ev.target.closest('#stl [data-stx]'); if(x){ KEY=''; paint(); return; }
    var c=ev.target.closest('#stl [data-stk]'); if(!c)return;
    var k=c.getAttribute('data-stk')||''; KEY=(KEY===k)?'':k; paint();
    if(KEY)setTimeout(function(){ var el=document.getElementById('sttBox'); if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'}); },40);
  });
})();
</script>
